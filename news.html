<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Новости — Промышленный репортёр</title>

  <!-- Favicon -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <meta name="theme-color" content="#ef2b1a">

  <script>
    (function () {
      const key = "theme";
      const saved = localStorage.getItem(key);
      const systemDark =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;

      const theme = saved || (systemDark ? "dark" : "light");

      if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>

  <style>
    :root{
      --bg:#f4f5f6;
      --paper:#ffffff;
      --ink:#0b0b0c;
      --muted:#5a5a61;
      --muted2:#7a7a83;

      --line:rgba(11,11,12,.12);
      --line2:rgba(11,11,12,.08);
      --soft:rgba(11,11,12,.05);

      --red:#f02000;

      --panel:#0b0b0c;
      --panelText:#f7f7f8;
      --panelMuted:rgba(247,247,248,.72);

      --max:1160px;
      --pad:22px;

      --r:16px;
      --r2:12px;

      --shadow:0 14px 26px rgba(11,11,12,.08);
      --shadow2:0 10px 18px rgba(11,11,12,.06);

      --headerBg:rgba(244,245,246,.92);
      --grid1:rgba(0,0,0,.028);
      --grid2:rgba(0,0,0,.024);
    }

    html[data-theme="dark"]{
      --bg:#0b0b0c;
      --paper:#101214;
      --ink:#f4f5f6;
      --muted:rgba(244,245,246,.70);
      --muted2:rgba(244,245,246,.58);

      --line:rgba(255,255,255,.12);
      --line2:rgba(255,255,255,.08);
      --soft:rgba(255,255,255,.06);

      --red:#ff2a2a;

      --panel:#0b0b0c;
      --panelText:#f7f7f8;
      --panelMuted:rgba(247,247,248,.72);

      --shadow:0 14px 26px rgba(0,0,0,.40);
      --shadow2:0 10px 18px rgba(0,0,0,.32);

      --headerBg:rgba(11,11,12,.72);
      --grid1:rgba(255,255,255,.06);
      --grid2:rgba(255,255,255,.05);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        "Segoe UI",
        Roboto,
        Arial,
        "Noto Sans",
        "Helvetica Neue",
        sans-serif;
      background:var(--bg);
      color:var(--ink);
      letter-spacing:.15px;
      text-rendering:geometricPrecision;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button{
      font-family:inherit;
    }

    .container{
      width:min(var(--max), calc(100% - var(--pad) * 2));
      margin:0 auto;
    }

    html,
    body{
      transition:
        background-color .18s ease,
        color .18s ease;
    }

    *{
      transition:
        background-color .18s ease,
        color .18s ease,
        border-color .18s ease;
    }

    .grid{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
      background:
        linear-gradient(
          to right,
          var(--grid1) 1px,
          transparent 1px
        ) 0 0 / 84px 84px,
        linear-gradient(
          to bottom,
          var(--grid2) 1px,
          transparent 1px
        ) 0 0 / 84px 84px;
      mask-image:
        radial-gradient(
          ellipse at 50% 0%,
          black 32%,
          transparent 72%
        );
      opacity:.45;
    }

    header{
      position:sticky;
      top:0;
      z-index:10;
      background:var(--headerBg);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:14px 0;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:260px;
    }

    .logoPlate{
      width:52px;
      height:44px;
      display:inline-grid;
      place-items:center;
      border-radius:12px;
      background:transparent;
      transition:
        background-color .18s ease,
        box-shadow .18s ease,
        border-color .18s ease;
      flex:0 0 auto;
    }

    .brand img{
      width:44px;
      height:44px;
      object-fit:contain;
      display:block;
      filter:none;
      transition:opacity .18s ease;
    }

    html[data-theme="dark"] .brand img{
      filter:none;
    }

    html[data-theme="dark"] .logoPlate{
      background:#f4f5f6;
      box-shadow:
        0 0 0 1px rgba(255,255,255,.10),
        0 8px 20px rgba(0,0,0,.30);
    }

    .brand:hover img{
      opacity:.85;
    }

    .brand .t{
      display:flex;
      flex-direction:column;
      line-height:1.05;
    }

    .brand .t strong{
      text-transform:uppercase;
      font-size:13px;
      letter-spacing:1.7px;
    }

    .brand .t span{
      font-size:12px;
      color:var(--muted);
    }

    .navlink{
      font-size:13px;
      color:var(--muted);
      padding:8px 0;
      border-bottom:2px solid transparent;
      transition:.14s ease;
      white-space:nowrap;
    }

    .navlink:hover{
      color:var(--ink);
      border-bottom-color:rgba(240,32,0,.28);
    }

    .navlink.active{
      color:var(--ink);
      border-bottom-color:var(--red);
    }

    .actions{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:240px;
      justify-content:flex-end;
    }

    .search{
      width:min(260px, 34vw);
      border:1px solid var(--line2);
      background:var(--paper);
      color:var(--ink);
      border-radius:999px;
      padding:10px 12px;
      font-size:13px;
      outline:none;
      transition:.14s ease;
    }

    .search:focus{
      border-color:rgba(240,32,0,.40);
      box-shadow:0 0 0 4px rgba(240,32,0,.08);
    }

    .btn{
      border:1px solid var(--ink);
      background:transparent;
      border-radius:999px;
      padding:10px 12px;
      font-size:13px;
      cursor:pointer;
      transition:.14s ease;
      white-space:nowrap;
      color:var(--ink);
    }

    .btn:hover{
      transform:translateY(-1px);
    }

    .btn.primary{
      border-color:var(--red);
      color:var(--red);
      font-weight:800;
    }

    .themeBtn{
      border-color:var(--line2);
      background:var(--paper);
      color:var(--ink);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:10px 12px;
      white-space:nowrap;
    }

    .themeBtn:hover{
      transform:translateY(-1px);
    }

    .themeIcon{
      width:18px;
      height:18px;
      display:block;
    }

    .themeLabel{
      font-weight:900;
      letter-spacing:.4px;
      font-size:12px;
      color:var(--muted);
    }

    @media (min-width:721px){
      .themeLabel{
        display:none;
      }

      .themeBtn{
        padding:10px 11px;
      }
    }

    .nav-desktop{
      display:flex;
      align-items:center;
      gap:18px;
    }

    .nav-mobile{
      display:none;
      position:relative;
    }

    .burger{
      cursor:pointer;
      user-select:none;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid var(--line2);
      background:var(--paper);
      color:var(--ink);
      font-weight:900;
      line-height:1;
    }

    .burger::-webkit-details-marker{
      display:none;
    }

    .burger::marker{
      content:"";
    }

    .nav-panel{
      display:none;
      position:absolute;
      top:calc(100% + 10px);
      right:0;
      min-width:min(320px, 92vw);
      padding:12px;
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:0 18px 40px rgba(0,0,0,.18);
      z-index:50;
      flex-direction:column;
      gap:10px;
    }

    .nav-mobile[open] .nav-panel{
      display:flex;
    }

    .nav-panel .navlink{
      color:var(--ink);
      padding:10px 8px;
      border-bottom:1px solid rgba(11,11,12,.06);
    }

    .nav-panel .navlink:last-child{
      border-bottom:0;
    }

    .nav-panel .themeBtn{
      width:100%;
      justify-content:center;
      border-color:var(--line2);
      background:rgba(11,11,12,.02);
    }

    main{
      position:relative;
      z-index:1;
      padding:24px 0 56px;
    }

    .kicker{
      display:flex;
      align-items:center;
      gap:10px;
      font-size:12px;
      letter-spacing:1.4px;
      text-transform:uppercase;
      color:var(--muted);
    }

    .kicker .dot{
      width:9px;
      height:9px;
      border-radius:3px;
      background:var(--red);
    }

    .layout{
      margin-top:14px;
      display:grid;
      grid-template-columns:1.35fr .9fr;
      gap:14px;
      align-items:start;
      grid-template-areas:"left feed";
    }

    .leftcol{
      grid-area:left;
    }

    .feed{
      grid-area:feed;
    }

    .controlbar{
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:var(--r);
      box-shadow:var(--shadow2);
      padding:10px 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom:14px;
    }

    .tabs{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .tab{
      font-size:13px;
      color:var(--muted);
      padding:8px 10px;
      border-radius:999px;
      border:1px solid transparent;
      transition:.14s ease;
      white-space:nowrap;
    }

    .tab:hover{
      color:var(--ink);
      border-color:rgba(240,32,0,.18);
      background:rgba(240,32,0,.04);
    }

    .tab.active{
      color:var(--ink);
      border-color:rgba(240,32,0,.22);
      background:rgba(240,32,0,.05);
      font-weight:900;
    }

    .hint{
      font-size:13px;
      color:var(--muted);
    }

    .biglist{
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .bigcard{
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:var(--r);
      box-shadow:var(--shadow2);
      padding:14px;
      transition:.14s ease;
      display:flex;
      flex-direction:column;
    }

    .bigcard:hover{
      transform:translateY(-2px);
      border-color:rgba(240,32,0,.22);
    }

    .bigrow{
      display:grid;
      grid-template-columns:240px 1fr;
      gap:14px;
      align-items:start;
    }

    .bigrow.no-thumb{
      grid-template-columns:1fr;
    }

    .thumb{
      border-radius:var(--r);
      border:1px solid var(--line);
      background:transparent;
      aspect-ratio:16/10;
      box-shadow:var(--shadow2);
      overflow:hidden;
    }

    .thumb img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .top{
      display:flex;
      justify-content:space-between;
      gap:10px;
      font-size:12px;
      color:var(--muted);
      align-items:center;
      flex-wrap:wrap;
    }

    .rubric{
      display:inline-flex;
      align-items:center;
      gap:8px;
      font-weight:900;
      color:var(--ink);
      letter-spacing:.2px;
    }

    .rubric::before{
      content:"";
      width:8px;
      height:8px;
      border-radius:2px;
      background:var(--red);
      display:inline-block;
    }

    .live{
      font-size:10px;
      font-weight:1000;
      letter-spacing:.9px;
      color:var(--red);
      border:1px solid rgba(240,32,0,.28);
      background:rgba(240,32,0,.06);
      padding:2px 6px;
      border-radius:999px;
      margin-left:auto;
    }

    .bigcard h3{
      margin:10px 0;
      font-size:16px;
      line-height:1.2;
    }

    .desc{
      margin:0;
      color:var(--muted);
      font-size:13px;
      line-height:1.55;
    }

    .chips{
      margin-top:12px;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
    }

    .chip{
      font-size:11px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--soft);
      background:rgba(11,11,12,.02);
      color:var(--muted);
    }

    .chip.hot{
      border-color:rgba(240,32,0,.22);
      background:rgba(240,32,0,.05);
      color:var(--ink);
      font-weight:800;
    }

    .feed{
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:var(--r);
      box-shadow:var(--shadow2);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height:360px;
      position:sticky;
      top:78px;
      max-height:calc(100vh - 96px);
    }

    .feed-head{
      padding:12px 14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      border-bottom:1px solid var(--line2);
      background:
        linear-gradient(
          180deg,
          rgba(11,11,12,.018),
          transparent
        );
    }

    .feed-title{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:900;
      letter-spacing:1.2px;
      text-transform:uppercase;
      font-size:12px;
    }

    .feed-title .pulse{
      width:9px;
      height:9px;
      border-radius:3px;
      background:var(--red);
      box-shadow:0 0 0 6px rgba(240,32,0,.08);
    }

    .feed-actions{
      display:flex;
      gap:8px;
      align-items:center;
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
    }

    .feed-actions a{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(240,32,0,.20);
      background:rgba(240,32,0,.05);
      color:var(--red);
      font-weight:900;
      transition:.14s ease;
    }

    .feed-actions a:hover{
      transform:translateY(-1px);
      background:rgba(240,32,0,.08);
    }

    .feed-list{
      padding:6px 0;
      overflow:auto;
    }

    .feed-item{
      display:grid;
      grid-template-columns:56px 1fr;
      gap:10px;
      padding:10px 14px;
      border-top:1px solid rgba(11,11,12,.06);
      transition:.12s ease;
      cursor:pointer;
    }

    .feed-item:first-child{
      border-top:0;
    }

    .feed-item:hover{
      background:rgba(11,11,12,.02);
    }

    .t-time{
      font-size:12px;
      color:var(--muted2);
      font-variant-numeric:tabular-nums;
      padding-top:1px;
    }

    .t-main{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width:0;
    }

    .t-top{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:12px;
      color:var(--muted);
    }

    .t-dot{
      width:7px;
      height:7px;
      border-radius:2px;
      background:var(--red);
      display:inline-block;
      transform:translateY(1px);
    }

    .t-rubric{
      font-weight:800;
      color:var(--ink);
    }

    .t-live{
      margin-left:auto;
      font-size:10px;
      font-weight:1000;
      letter-spacing:.9px;
      color:var(--red);
      border:1px solid rgba(240,32,0,.28);
      background:rgba(240,32,0,.06);
      padding:2px 6px;
      border-radius:999px;
    }

    .t-title{
      font-size:13px;
      line-height:1.35;
      color:var(--ink);
      font-weight:700;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .article{
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:var(--r);
      box-shadow:var(--shadow2);
      overflow:hidden;
      padding:16px;
    }

    .articleTitle{
      margin:0 0 14px;
      font-size:clamp(28px, 3vw, 44px);
      line-height:1.05;
      letter-spacing:.15px;
      font-weight:1000;
    }

    .articleMeta{
      margin:-4px 0 14px;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      font-size:12px;
      color:var(--muted);
    }

    .articleMeta span{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--soft);
      background:rgba(11,11,12,.02);
      color:var(--muted);
    }

    .media{
      margin-top:10px;
      border-radius:var(--r);
      border:1px solid var(--line);
      background:transparent;
      aspect-ratio:16/9;
      box-shadow:var(--shadow2);
      position:relative;
      overflow:hidden;
    }

    .media img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .caption{
      margin-top:10px;
      font-size:12px;
      color:var(--muted2);
      line-height:1.55;
    }

    .body{
      margin-top:16px;
      border-top:1px solid rgba(11,11,12,.06);
      padding-top:16px;
    }

    .body p{
      margin:0 0 12px;
      font-size:15px;
      line-height:1.75;
      color:var(--ink);
      max-width:78ch;
      white-space:pre-wrap;
    }

    .toolbar{
      margin-top:16px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .more{
      font-size:13px;
      color:var(--red);
      font-weight:900;
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(240,32,0,.22);
      background:rgba(240,32,0,.05);
      transition:.14s ease;
      white-space:nowrap;
      cursor:pointer;
    }

    .more:hover{
      transform:translateY(-1px);
      background:rgba(240,32,0,.08);
    }

    .related{
      margin-top:18px;
      border-top:1px solid rgba(11,11,12,.06);
      padding-top:16px;
    }

    .relatedHead{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:14px;
      margin-bottom:12px;
    }

    .relatedHead h2{
      margin:0;
      font-size:18px;
      letter-spacing:.2px;
    }

    .relatedHead p{
      margin:0;
      font-size:13px;
      color:var(--muted);
    }

    .relGrid{
      display:grid;
      grid-template-columns:repeat(12, 1fr);
      gap:14px;
      margin-top:12px;
    }

    .relCard{
      grid-column:span 6;
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:var(--r);
      padding:14px;
      box-shadow:var(--shadow2);
      transition:.14s ease;
      cursor:pointer;
    }

    .relCard:hover{
      transform:translateY(-2px);
      border-color:rgba(240,32,0,.22);
    }

    .relCard .top{
      display:flex;
      justify-content:space-between;
      gap:10px;
      font-size:12px;
      color:var(--muted);
    }

    .relCard h3{
      margin:10px 0;
      font-size:16px;
      line-height:1.2;
    }

    footer{
      margin-top:34px;
      border-top:1px solid var(--line);
      padding:18px 0;
      color:var(--muted);
      font-size:12px;
      display:flex;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
    }

    @media (max-width:980px){
      .layout{
        grid-template-columns:1fr;
        grid-template-areas:
          "feed"
          "left";
      }

      .feed{
        position:relative;
        top:auto;
        max-height:none;
        min-height:auto;
      }

      .feed-list{
        max-height:280px;
        overflow-y:auto;
        -webkit-overflow-scrolling:touch;
        overscroll-behavior:contain;
        scrollbar-gutter:stable both-edges;
      }

      .actions .search{
        display:none;
      }

      .bigrow{
        grid-template-columns:1fr;
      }

      .relCard{
        grid-column:span 12;
      }
    }

    @media (max-width:720px){
      .brand{
        min-width:auto;
      }

      .nav-desktop{
        display:none;
      }

      .nav-mobile{
        display:block;
      }

      .actions .themeBtn{
        display:none;
      }

      .actions{
        min-width:auto;
      }

      .feed{
        display:none;
      }
    }

    @media (prefers-reduced-motion:reduce){
      *{
        transition:none !important;
      }

      .feed-actions a:hover,
      .more:hover,
      .btn:hover,
      .bigcard:hover,
      .relCard:hover{
        transform:none !important;
      }
    }
  </style>
</head>

<body>
  <div class="grid" aria-hidden="true"></div>

  <header>
    <div class="container">
      <div class="topbar">
        <a class="brand" href="index.html">
          <span class="logoPlate">

  <script>
    "use strict";

    /*
     * Новости проверяются не чаще одного раза в пять минут.
     * Первая загрузка выполняется сразу при открытии страницы.
     */
    const CONTENT_REFRESH_MS = 5 * 60 * 1000;

    function formatTime(ts){
      if (!ts) {
        return "";
      }

      const d = new Date(Number(ts) * 1000);

      if (Number.isNaN(d.getTime())) {
        return "";
      }

      return d.toLocaleTimeString("ru-RU", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function formatDate(ts){
      if (!ts) {
        return "";
      }

      const d = new Date(Number(ts) * 1000);

      if (Number.isNaN(d.getTime())) {
        return "";
      }

      return d.toLocaleDateString("ru-RU", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    function formatDateTime(ts){
      if (!ts) {
        return "";
      }

      const d = new Date(Number(ts) * 1000);

      if (Number.isNaN(d.getTime())) {
        return "";
      }

      return d.toLocaleString("ru-RU", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function relTime(ts){
      if (!ts) {
        return "";
      }

      const diff = Math.max(
        0,
        Date.now() - Number(ts) * 1000
      );

      const minutes = Math.floor(diff / 60000);

      if (minutes < 1) {
        return "сейчас";
      }

      if (minutes < 60) {
        return `${minutes} мин`;
      }

      const hours = Math.floor(minutes / 60);

      if (hours < 24) {
        return `${hours} ч`;
      }

      const days = Math.floor(hours / 24);

      return days === 1
        ? "вчера"
        : `${days} дн`;
    }

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeMediaUrl(url){
      if (!url) {
        return null;
      }

      let value = String(url).trim();

      if (!value) {
        return null;
      }

      if (value.startsWith("//")) {
        value = window.location.protocol + value;
      }

      if (value.startsWith("/")) {
        value = new URL(
          value,
          window.location.origin
        ).href;
      }

      if (
        window.location.protocol === "https:" &&
        value.startsWith("http://")
      ) {
        value = "https://" + value.slice(7);
      }

      return value;
    }

    function pickImageUrl(value){
      if (!value) {
        return null;
      }

      if (typeof value === "string") {
        return normalizeMediaUrl(value);
      }

      if (Array.isArray(value)) {
        const candidates = value
          .map(item => {
            const url = pickImageUrl(item);

            const area =
              Number(item?.width || item?.w || 0) *
              Number(item?.height || item?.h || 0);

            return {
              url,
              area
            };
          })
          .filter(item => item.url);

        candidates.sort(
          (a, b) => b.area - a.area
        );

        return candidates[0]?.url || null;
      }

      if (typeof value === "object") {
        if (Array.isArray(value.sizes)) {
          return pickImageUrl(value.sizes);
        }

        if (Array.isArray(value.photo?.sizes)) {
          return pickImageUrl(value.photo.sizes);
        }

        if (Array.isArray(value.attachments)) {
          return pickImageUrl(value.attachments);
        }

        const keys = [
          "url",
          "src",
          "href",
          "image",
          "photo",
          "thumb",
          "thumbnail",
          "cover",
          "preview",
          "picture"
        ];

        for (const key of keys) {
          if (value[key]) {
            const url = pickImageUrl(value[key]);

            if (url) {
              return url;
            }
          }
        }
      }

      return null;
    }

    /*
     * Отсекает очевидные ссылки на видео, документы и архивы.
     * CDN-ссылки без расширения не блокируются: они часто ведут
     * на корректные изображения.
     */
    function isExplicitNonImageUrl(url){
      const value =
        String(url || "")
          .split("#")[0]
          .split("?")[0]
          .toLowerCase();

      return /\.(?:mp4|webm|mov|avi|mkv|m3u8|pdf|docx?|xlsx?|pptx?|zip|rar|7z)$/i
        .test(value);
    }

    /*
     * Извлекает только настоящее изображение новости.
     *
     * Вложения video, link, doc и другие типы больше не могут
     * случайно использоваться как превью через поле href/url.
     */
    function pickNewsImage(post){
      const directCandidates = [
        post?.photo,
        post?.thumb,
        post?.thumbnail,
        post?.image,
        post?.cover,
        post?.preview,
        post?.picture
      ];

      for (const candidate of directCandidates) {
        const image = pickImageUrl(candidate);

        if (
          image &&
          !isExplicitNonImageUrl(image)
        ) {
          return image;
        }
      }

      const attachments =
        Array.isArray(post?.attachments)
          ? post.attachments
          : [];

      const allowedTypes = new Set([
        "photo",
        "image",
        "picture"
      ]);

      for (const attachment of attachments) {
        const type =
          String(attachment?.type || "")
            .trim()
            .toLowerCase();

        if (
          type &&
          !allowedTypes.has(type)
        ) {
          continue;
        }

        const explicitImage =
          attachment?.photo ||
          attachment?.image ||
          attachment?.picture ||
          attachment?.preview ||
          attachment?.thumb ||
          attachment?.thumbnail ||
          attachment?.cover ||
          null;

        const source =
          explicitImage ||
          (
            allowedTypes.has(type) ||
            Array.isArray(attachment?.sizes)
              ? attachment
              : null
          );

        const image = pickImageUrl(source);

        if (
          image &&
          !isExplicitNonImageUrl(image)
        ) {
          return image;
        }
      }

      return null;
    }

    function hasKeyword(text, keyword){
      if (keyword instanceof RegExp) {
        return keyword.test(text);
      }

      return text.includes(keyword);
    }

    const CATEGORY_RULES = [

    function detectCategory(text){
      const normalizedText =
        String(text || "").toLowerCase();

      for (const rule of CATEGORY_RULES) {
        if (
          rule.keywords.some(
            keyword => hasKeyword(normalizedText, keyword)
          )
        ) {
          return {
            tab: rule.tab,
            rubric: rule.rubric
          };
        }
      }

      return {
        tab: "events",
        rubric: "События"
      };
    }

    function normalizeCategory(tab, rubric, text){
      const rawTab =
        String(tab || "").trim().toLowerCase();

      const rawRubric =
        String(rubric || "").trim().toLowerCase();

      const aliases = {
        market: {
          tab: "market",
          rubric: "Рынок"
        },
        рынок: {
          tab: "market",
          rubric: "Рынок"
        },
        tech: {
          tab: "technologies",
          rubric: "Технологии"
        },
        тех: {
          tab: "technologies",
          rubric: "Технологии"
        },
        technology: {
          tab: "technologies",
          rubric: "Технологии"
        },
        technologies: {
          tab: "technologies",
          rubric: "Технологии"
        },
        технологии: {
          tab: "technologies",
          rubric: "Технологии"
        },
        events: {
          tab: "events",
          rubric: "События"
        },
        event: {
          tab: "events",
          rubric: "События"
        },
        события: {
          tab: "events",
          rubric: "События"
        },
        событие: {
          tab: "events",
          rubric: "События"
        }
      };

      if (
        rawTab === "opinion" ||
        rawRubric === "колонка"
      ) {
        return detectCategory(text);
      }

      return (
        aliases[rawTab] ||
        aliases[rawRubric] ||
        detectCategory(text)
      );
    }

    function matchesFilter(article){
      const tabMatches =
        state.tab === "all" ||
        article.tab === state.tab;

      const liveMatches =
        !state.liveOnly ||
        article.live;

      const query =
        state.query.trim().toLowerCase();

      const queryMatches =
        !query ||
        (article.title || "")
          .toLowerCase()
          .includes(query) ||
        (article.lead || "")
          .toLowerCase()
          .includes(query) ||
        (article.rubric || "")
          .toLowerCase()
          .includes(query) ||
        (
          Array.isArray(article.body) &&
          article.body
            .join(" ")
            .toLowerCase()
            .includes(query)
        );

      return (
        tabMatches &&
        liveMatches &&
        queryMatches
      );
    }

    function relatedFor(article){
      const sameTab = ARTICLES.filter(
        item =>
          item.id !== article.id &&
          item.tab === article.tab
      );

      const fallback = ARTICLES.filter(
        item =>
          item.id !== article.id &&
          item.tab !== article.tab
      );

      return [
        ...sameTab,
        ...fallback
      ].slice(0, 4);
    }

    /*
     * Исправленная сборка новостей.
     *
     * В исходной версии использовался reverse(), поэтому
     * порядок зависел от того, в каком порядке сервер
     * формировал JSON.
     *
     * Теперь новости всегда сортируются по date:
     * самые свежие находятся сверху.
     *
     * Также больше не отбрасываются публикации,
     * содержащие видеовложения.
     */
    function buildFromFeed(posts){
      const sourcePosts =
        Array.isArray(posts)
          ? posts
          : [];

      const sorted = sourcePosts
        .slice()
        .sort((a, b) => {
          const dateA =
            Number(a?.date || 0);

          const dateB =
            Number(b?.date || 0);

          if (dateA !== dateB) {
            return dateB - dateA;
          }

          const idA =
            Number(a?.id || a?.post_id || 0);

          const idB =
            Number(b?.id || b?.post_id || 0);

          return idB - idA;
        });

      ARTICLES = sorted
        .map((post, index) => {
          const text =
            String(
              post?.text ||
              post?.title ||
              ""
            );

          const parts = text
            .split(/\n\s*\n/)
            .map(item => item.trim())
            .filter(Boolean);

          const title = (
            parts[0] ||
            post?.title ||
            text ||
            "Новость"
          ).slice(0, 120);

          const lead = (
            parts[1] ||
            post?.description ||
            parts[0] ||
            ""
          ).slice(0, 220);

          const category = normalizeCategory(
            post?.tab,
            post?.rubric,
            text
          );

          const bodyParts =
            parts.length > 1
              ? parts.slice(1)
              : [text].filter(Boolean);

          const timestamp =
            Number(post?.date || 0) || null;

          const generatedId =
            `${timestamp || Date.now()}-${index}`;

          const thumb =
            pickNewsImage(post);

          /*
           * Новость без превью не попадает ни в список,
           * ни в боковую ленту, ни в связанные материалы.
           */
          if (!thumb) {
            return null;
          }

          return {
            id: String(
              post?.id ??
              post?.post_id ??
              generatedId
            ),

            tab: category.tab,
            rubric: category.rubric,

            thumb,

            when:
              timestamp
                ? formatDate(timestamp)
                : "",

            age:
              timestamp
                ? relTime(timestamp)
                : "",

            live:
              Boolean(post?.live),

            title,
            lead,

            tags: [],

            author:
              post?.author ||
              "ВКонтакте",

            updated:
              timestamp
                ? formatDateTime(timestamp)
                : "",

            caption:
              "Источник: сообщество ВКонтакте",

            body:
              bodyParts.length
                ? bodyParts
                : [lead || title],

            ts: timestamp
          };
        })
        .filter(Boolean);

      feedItems = ARTICLES.map(article => ({
        id: article.id,

        time:
          article.ts
            ? formatTime(article.ts)
            : "",

        rubric: article.rubric,
        title: article.title,
        live: article.live
      }));
    }

    /*
     * Даже при наличии URL файл изображения может быть удалён
     * или недоступен. В этом случае удаляем всю публикацию,
     * а не оставляем карточку с пустым местом.
     */
    function removeArticleWithoutPreview(id){
      const articleId =
        String(id || "");

      if (
        !articleId ||
        !ARTICLES.some(
          article => article.id === articleId
        )
      ) {
        return;
      }

      ARTICLES = ARTICLES.filter(
        article => article.id !== articleId
      );

      feedItems = feedItems.filter(
        item => item.id !== articleId
      );

      if (state.selectedId === articleId) {
        state.selectedId = null;

        history.replaceState(
          null,
          "",
          "news.html"
        );
      }

      renderList();
      renderFeed();
    }

    function bindPreviewErrorHandlers(root){
      root
        ?.querySelectorAll("img[data-preview-id]")
        .forEach(image => {
          image.addEventListener(
            "error",
            () => {
              removeArticleWithoutPreview(
                image.dataset.previewId
              );
            },
            {
              once: true
            }
          );
        });
    }

    function renderList(){
      const items =
        ARTICLES.filter(
          article =>
            Boolean(article.thumb) &&
            matchesFilter(article)
        );

      pageTitle.textContent =
        state.selectedId
          ? "Статья"
          : "Новости";

      leftHint.textContent =
        state.selectedId
          ? "Полная статья"
          : `Большие материалы · ${items.length} шт.`;

      if (state.selectedId) {
        listView.style.display = "none";
        articleView.style.display = "block";
        renderArticle(state.selectedId);
        return;
      }

      articleView.style.display = "none";
      listView.style.display = "flex";

      if (items.length === 0) {
        listView.innerHTML = `
          <div class="bigcard">
            <h3>Пока нет новостей</h3>
          </div>
        `;

        return;
      }

      listView.innerHTML = items
        .map(article => {
          const thumb =
            normalizeMediaUrl(article.thumb);

          const thumbHtml = thumb
            ? `
              <div
                class="thumb"
                aria-hidden="true"
              >
                <img
                  src="${escapeHtml(thumb)}"
                  alt=""
                  loading="lazy"
                  decoding="async"
                  data-preview-id="${escapeHtml(article.id)}"
                />
              </div>
            `
            : "";

          const rowClass =
            thumb
              ? "bigrow"
              : "bigrow no-thumb";

          return `
            <a
              class="bigcard"
              href="#${encodeURIComponent(article.id)}"
              data-open="${escapeHtml(article.id)}"
              aria-label="Открыть материал: ${escapeHtml(article.title)}"
            >
              <div class="${rowClass}">
                ${thumbHtml}

                <div>
                  <div class="top">
                    <span class="rubric">
                      ${escapeHtml(article.rubric)}
                    </span>

                    <span>
                      ${escapeHtml(article.when || "")}
                    </span>

                    ${
                      article.live
                        ? `<span class="live">LIVE</span>`
                        : ""
                    }
                  </div>

                  <h3>
                    ${escapeHtml(article.title)}
                  </h3>

                  <p class="desc">
                    ${escapeHtml(article.lead || "")}
                  </p>

                  <div class="chips">
                    <span class="chip hot">
                      ${
                        escapeHtml(
                          article.ts
                            ? formatDate(article.ts)
                            : "Лента"
                        )
                      }
                    </span>

                    <span class="chip">
                      ${
                        article.thumb
                          ? "Фото"
                          : "Материал"
                      }
                    </span>
                  </div>
                </div>
              </div>
            </a>
          `;
        })
        .join("");

      bindPreviewErrorHandlers(listView);

      listView
        .querySelectorAll("[data-open]")
        .forEach(element => {
          element.addEventListener(
            "click",
            event => {
              event.preventDefault();
              openArticle(element.dataset.open);
            }
          );
        });
    }

    function renderArticle(id){
      const article = ARTICLES.find(
        item => item.id === id
      );

      if (!article) {
        state.selectedId = null;
        renderList();
        return;
      }

      const related =
        relatedFor(article);

      const thumb =
        normalizeMediaUrl(article.thumb);

      articleView.innerHTML = `
        <h1 class="articleTitle">
          ${escapeHtml(article.title)}
        </h1>

        <div class="articleMeta">
          <span>
            ${escapeHtml(article.rubric || "События")}
          </span>

          ${
            article.updated
              ? `<span>${escapeHtml(article.updated)}</span>`
              : ""
          }

          ${
            article.author
              ? `<span>${escapeHtml(article.author)}</span>`
              : ""
          }
        </div>

        ${
          thumb
            ? `
              <div class="media">
                <img
                  src="${escapeHtml(thumb)}"
                  alt=""
                  decoding="async"
                  data-preview-id="${escapeHtml(article.id)}"
                />
              </div>
            `
            : ""
        }

        ${
          thumb && article.caption
            ? `
              <div class="caption">
                ${escapeHtml(article.caption)}
              </div>
            `
            : ""
        }

        <div class="body">
          ${
            article.body
              .map(
                paragraph => `
                  <p>${escapeHtml(paragraph)}</p>
                `
              )
              .join("")
          }
        </div>

        <div class="toolbar">
          <button
            class="more"
            id="backBtn"
            type="button"
          >
            ← К списку
          </button>
        </div>

        ${
          related.length
            ? `
              <div class="related">
                <div class="relatedHead">
                  <div>
                    <h2>Ещё по теме</h2>
                    <p>Похожие материалы из ленты</p>
                  </div>
                </div>

                <div class="relGrid">
                  ${
                    related
                      .map(
                        item => `
                          <a
                            class="relCard"
                            href="#${encodeURIComponent(item.id)}"
                            data-open-related="${escapeHtml(item.id)}"
                          >
                            <div class="top">
                              <span class="rubric">
                                ${escapeHtml(item.rubric)}
                              </span>

                              <span>
                                ${escapeHtml(item.when || "")}
                              </span>
                            </div>

                            <h3>
                              ${escapeHtml(item.title)}
                            </h3>

                            <p class="desc">
                              ${escapeHtml(item.lead || "")}
                            </p>
                          </a>
                        `
                      )
                      .join("")
                  }
                </div>
              </div>
            `
            : ""
        }
      `;

      bindPreviewErrorHandlers(articleView);

      articleView
        .querySelector("#backBtn")
        ?.addEventListener(
          "click",
          () => {
            state.selectedId = null;

            history.replaceState(
              null,
              "",
              "news.html"
            );

            renderList();

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });
          }
        );

      articleView
        .querySelectorAll("[data-open-related]")
        .forEach(element => {
          element.addEventListener(
            "click",
            event => {
              event.preventDefault();

              openArticle(
                element.dataset.openRelated
              );
            }
          );
        });
    }

    function openArticle(id){
      state.selectedId = id;

      history.replaceState(
        null,
        "",
        `news.html#${encodeURIComponent(id)}`
      );

      renderList();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    function renderFeed(){
      const query =
        state.query.trim().toLowerCase();

      const items = (
        state.liveOnly
          ? feedItems.filter(item => item.live)
          : feedItems
      ).filter(
        item =>
          !query ||
          (item.title || "")
            .toLowerCase()
            .includes(query)
      );

      if (items.length === 0) {
        feedList.innerHTML = `
          <div class="feed-item">
            <div class="t-time"></div>

            <div class="t-main">
              <div class="t-title">
                Пока нет новостей
              </div>
            </div>
          </div>
        `;

        return;
      }

      feedList.innerHTML = items
        .map(
          item => `
            <div
              class="feed-item"
              data-open="${escapeHtml(item.id)}"
            >
              <div class="t-time">
                ${escapeHtml(item.time || "")}
              </div>

              <div class="t-main">
                <div class="t-top">
                  <span class="t-dot"></span>

                  <span class="t-rubric">
                    ${escapeHtml(item.rubric)}
                  </span>

                  ${
                    item.live
                      ? `<span class="t-live">LIVE</span>`
                      : ""
                  }
                </div>

                <div class="t-title">
                  ${escapeHtml(item.title)}
                </div>
              </div>
            </div>
          `
        )
        .join("");

      feedList
        .querySelectorAll("[data-open]")
        .forEach(element => {
          element.addEventListener(
            "click",
            () => {
              openArticle(element.dataset.open);
            }
          );
        });
    }

    document
      .querySelectorAll(".tab")
      .forEach(element => {
        element.addEventListener(
          "click",
          event => {
            event.preventDefault();

            document
              .querySelectorAll(".tab")
              .forEach(tab => {
                tab.classList.remove("active");
              });

            element.classList.add("active");

            state.tab =
              element.dataset.tab;

            state.selectedId = null;

            history.replaceState(
              null,
              "",
              "news.html"
            );

            renderList();
            renderFeed();
          }
        );
      });

    liveToggle.addEventListener(
      "click",
      event => {
        event.preventDefault();

        state.liveOnly =
          !state.liveOnly;

        liveToggle.textContent =
          state.liveOnly
            ? "Все"
            : "Только LIVE";

        renderFeed();

        if (!state.selectedId) {
          renderList();
        }
      }
    );

    headerSearch.addEventListener(
      "input",
      event => {
        state.query =
          event.target.value || "";

        if (!state.selectedId) {
          renderList();
        }

        renderFeed();
      }
    );

    function openFromHash(){
      const raw = window.location.hash
        .replace(/^#/, "")
        .trim();

      if (!raw) {
        state.selectedId = null;
        renderList();
        renderFeed();
        return;
      }

      let id = raw;

      try {
        id = decodeURIComponent(raw);
      } catch (error) {
        console.warn(
          "Некорректный идентификатор в адресе:",
          error
        );
      }

      const exists = ARTICLES.some(
        article => article.id === id
      );

      state.selectedId =
        exists
          ? id
          : null;

      renderList();
      renderFeed();
    }

    /*
     * Добавляет уникальный параметр к каждому запросу.
     * Это помогает обходить кеш браузера и CDN.
     */
    function cacheBust(url){
      const requestUrl = new URL(
        url,
        window.location.href
      );

      requestUrl.searchParams.set(
        "_",
        `${Date.now()}-${Math.random()
          .toString(36)
          .slice(2)}`
      );

      return requestUrl.href;
    }

    /*
     * Загрузка JSON с отключенным кешированием.
     */
    async function loadJson(url){
      const response = await fetch(
        cacheBust(url),
        {
          method: "GET",
          cache: "no-store",
          credentials: "same-origin",

          headers: {
            "Accept": "application/json",
            "Cache-Control":
              "no-cache, no-store, max-age=0",
            "Pragma": "no-cache"
          }
        }
      );

      if (!response.ok) {
        throw new Error(
          `Не удалось загрузить ${url}: HTTP ${response.status}`
        );
      }

      return response.json();
    }

    /*
     * Поддерживаемые варианты feed.json:
     *
     * 1. Обычный массив:
     *    [ {...}, {...} ]
     *
     * 2. Объект:
     *    { "items": [...] }
     *
     * 3. Объект:
     *    { "posts": [...] }
     *
     * 4. Ответ, похожий на VK API:
     *    { "response": { "items": [...] } }
     */
    function extractPosts(data){
      if (Array.isArray(data)) {
        return data;
      }

      if (Array.isArray(data?.items)) {
        return data.items;
      }

      if (Array.isArray(data?.posts)) {
        return data.posts;
      }

      if (
        Array.isArray(
          data?.response?.items
        )
      ) {
        return data.response.items;
      }

      console.warn(
        "Неизвестный формат feed.json:",
        data
      );

      return [];
    }

    /*
     * Обновление новостной ленты.
     *
     * refreshInProgress защищает от нескольких
     * одновременных запросов. Дополнительные события окна
     * учитывают пятиминутный интервал и не создают лишних проверок.
     */
    async function refreshNewsContent(silent = false){
      if (refreshInProgress) {
        return;
      }

      refreshInProgress = true;
      lastRefreshAt = Date.now();

      try {
        if (!silent) {
          feedStatus.textContent =
            "обновляется";
        }

        /*
         * Загружаем только новостной JSON.
         *
         * В исходном коде обновление новостей ожидало
         * загрузки дополнительных TV-файлов.
         * Теперь медленные TV-запросы не задерживают ленту.
         */
        const data = await loadJson(
          "content/news/feed.json"
        );

        const posts =
          extractPosts(data);

        buildFromFeed(posts);
        openFromHash();

        const stamp =
          new Date().toLocaleTimeString(
            "ru-RU",
            {
              hour: "2-digit",
              minute: "2-digit",
              second: "2-digit"
            }
          );

        feedStatus.textContent =
          `обновлено ${stamp}`;

        console.info(
          `[Новости] Получено: ${posts.length}; с превью: ${ARTICLES.length}. Обновлено: ${stamp}`
        );
      } catch (error) {
        console.error(
          "Ошибка загрузки новостной ленты:",
          error
        );

        feedStatus.textContent =
          ARTICLES.length
            ? "не удалось обновить"
            : "ошибка загрузки";

        renderList();
        renderFeed();
      } finally {
        refreshInProgress = false;
      }
    }

    function refreshNewsIfDue(){
      if (
        Date.now() - lastRefreshAt >=
        CONTENT_REFRESH_MS
      ) {
        refreshNewsContent(true);
      }
    }

    async function initNews(){
      await refreshNewsContent(false);

      if (refreshTimer) {
        clearInterval(refreshTimer);
      }

      refreshTimer = setInterval(
        refreshNewsIfDue,
        CONTENT_REFRESH_MS
      );

      if (!visibilityRefreshBound) {
        visibilityRefreshBound = true;

        document.addEventListener(
          "visibilitychange",
          () => {
            if (!document.hidden) {
              refreshNewsIfDue();
            }
          }
        );

        window.addEventListener(
          "focus",
          refreshNewsIfDue
        );

        window.addEventListener(
          "pageshow",
          refreshNewsIfDue
        );

        window.addEventListener(
          "online",
          refreshNewsIfDue
        );
      }
    }

    initNews();

    window.addEventListener(
      "hashchange",
      openFromHash
    );
  </script>

  <script>
    (function(){
      const details =
        document.querySelector(".nav-mobile");

      if (!details) {
        return;
      }

      details
        .querySelectorAll("a")
        .forEach(link => {
          link.addEventListener(
            "click",
            () => {
              details.removeAttribute("open");
            }
          );
        });

      document.addEventListener(
        "click",
        event => {
          if (
            details.hasAttribute("open") &&
            !details.contains(event.target)
          ) {
            details.removeAttribute("open");
          }
        }
      );

      document.addEventListener(
        "keydown",
        event => {
          if (event.key === "Escape") {
            details.removeAttribute("open");
          }
        }
      );
    })();
  </script>

  <script>
    (function () {
      const KEY = "theme";

      const root =
        document.documentElement;

      const toggles = Array.from(
        document.querySelectorAll(
          "[data-theme-toggle]"
        )
      );

      const ICON_MOON = `
        <path
          fill="currentColor"
          d="M21.4 13.1a8.9 8.9 0 0 1-10.5-10.5A9.6 9.6 0 1 0 21.4 13.1Z"
        />
      `;

      const ICON_SUN = `
        <path
          fill="currentColor"
          d="M12 18.2a6.2 6.2 0 1 1 0-12.4a6.2 6.2 0 0 1 0 12.4Zm0-14.9a1 1 0 0 1 1 1v1.2a1 1 0 1 1-2 0V4.3a1 1 0 0 1 1-1Zm0 16.2a1 1 0 0 1 1 1v1.2a1 1 0 1 1-2 0v-1.2a1 1 0 0 1 1-1ZM4.3 11a1 1 0 1 1 0 2H3.1a1 1 0 1 1 0-2h1.2Zm17.8 0a1 1 0 1 1 0 2h-1.2a1 1 0 1 1 0-2h1.2ZM6 5.6a1 1 0 0 1 1.4 0l.8.8a1 1 0 1 1-1.4 1.4l-.8-.8a1 1 0 0 1 0-1.4Zm11.2 11.2a1 1 0 0 1 1.4 0l.8.8a1 1 0 1 1-1.4 1.4l-.8-.8a1 1 0 0 1 0-1.4ZM18.4 5.6a1 1 0 0 1 0 1.4l-.8.8a1 1 0 1 1-1.4-1.4l.8-.8a1 1 0 0 1 1.4 0ZM7.8 16.2a1 1 0 0 1 0 1.4l-.8.8a1 1 0 1 1-1.4-1.4l.8-.8a1 1 0 0 1 1.4 0Z"
        />
      `;

      function currentTheme(){
        return (
          root.getAttribute("data-theme") === "dark"
            ? "dark"
            : "light"
        );
      }

      function setIconAndLabel(button, theme){
        const svg =
          button.querySelector("svg");

        if (!svg) {
          return;
        }

        const isDark =
          theme === "dark";

        svg.innerHTML =
          isDark
            ? ICON_SUN
            : ICON_MOON;

        button.setAttribute(
          "aria-label",
          isDark
            ? "Включить светлую тему"
            : "Включить тёмную тему"
        );

        const label =
          button.querySelector(".themeLabel");

        if (label) {
          label.textContent =
            isDark
              ? "Свет"
              : "Тема";
        }
      }

      function apply(theme){
        if (theme === "dark") {
          root.setAttribute(
            "data-theme",
            "dark"
          );
        } else {
          root.removeAttribute(
            "data-theme"
          );
        }

        toggles.forEach(button => {
          const isDark =
            theme === "dark";

          button.setAttribute(
            "aria-pressed",
            isDark
              ? "true"
              : "false"
          );

          setIconAndLabel(
            button,
            theme
          );
        });
      }

      toggles.forEach(button => {
        button.addEventListener(
          "click",
          () => {
            const next =
              currentTheme() === "dark"
                ? "light"
                : "dark";

            localStorage.setItem(
              KEY,
              next
            );

            apply(next);
          }
        );
      });

      apply(
        localStorage.getItem(KEY) ||
        currentTheme()
      );
    })();
  </script>
