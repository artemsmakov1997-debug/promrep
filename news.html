<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Новости — Промышленный репортёр</title>

  <!-- Применяем тему ДО отрисовки (без мигания) -->
  <script>
    (function () {
      const key = "theme"; // "light" | "dark"
      const saved = localStorage.getItem(key);
      const systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = saved || (systemDark ? "dark" : "light");
      if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
    })();
  </script>

  <style>
    :root{
      --bg:#f4f5f6;
      --paper:#ffffff;
      --ink:#0b0b0c;
      --muted:#5a5a61;
      --muted2:#7a7a83;

      --line:rgba(11,11,12,.12);
      --line2:rgba(11,11,12,.08);
      --soft:rgba(11,11,12,.05);

      --red:#f02000;

      --panel:#0b0b0c;
      --panelText:#f7f7f8;
      --panelMuted:rgba(247,247,248,.72);

      --max:1160px;
      --pad:22px;

      --r:16px;
      --r2:12px;

      --shadow: 0 14px 26px rgba(11,11,12,.08);
      --shadow2: 0 10px 18px rgba(11,11,12,.06);

      /* как на главной */
      --headerBg: rgba(244,245,246,.92);
      --grid1: rgba(0,0,0,.028);
      --grid2: rgba(0,0,0,.024);
    }

    html[data-theme="dark"]{
      --bg:#0b0b0c;
      --paper:#101214;
      --ink:#f4f5f6;
      --muted:rgba(244,245,246,.70);
      --muted2:rgba(244,245,246,.58);

      --line:rgba(255,255,255,.12);
      --line2:rgba(255,255,255,.08);
      --soft:rgba(255,255,255,.06);

      --red:#ff2a2a;

      --panel:#0b0b0c;
      --panelText:#f7f7f8;
      --panelMuted:rgba(247,247,248,.72);

      --shadow: 0 14px 26px rgba(0,0,0,.40);
      --shadow2: 0 10px 18px rgba(0,0,0,.32);

      --headerBg: rgba(11,11,12,.72);
      --grid1: rgba(255,255,255,.06);
      --grid2: rgba(255,255,255,.05);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--ink);
      letter-spacing:.15px;
      text-rendering: geometricPrecision;
    }
    a{ color:inherit; text-decoration:none; }
    button{ font-family:inherit; }
    .container{ width:min(var(--max), calc(100% - var(--pad)*2)); margin:0 auto; }

    html, body { transition: background-color .18s ease, color .18s ease; }
    *{ transition: background-color .18s ease, color .18s ease, border-color .18s ease; }

    .grid{
      position:fixed; inset:0; pointer-events:none; z-index:0;
      background:
        linear-gradient(to right, var(--grid1) 1px, transparent 1px) 0 0/ 84px 84px,
        linear-gradient(to bottom, var(--grid2) 1px, transparent 1px) 0 0/ 84px 84px;
      mask-image: radial-gradient(ellipse at 50% 0%, black 32%, transparent 72%);
      opacity:.45;
    }

    /* Header (как на главной) */
    header{
      position:sticky; top:0; z-index:10;
      background: var(--headerBg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .topbar{
      display:flex; align-items:center; justify-content:space-between; gap:16px;
      padding: 14px 0;
    }
    .brand{
      display:flex; align-items:center; gap:12px;
      min-width: 260px;
    }
    .brand img{ width:44px; height:44px; object-fit:contain; display:block; }
    .brand .t{ display:flex; flex-direction:column; line-height:1.05; }
    .brand .t strong{ text-transform:uppercase; font-size:13px; letter-spacing:1.7px; }
    .brand .t span{ font-size:12px; color: var(--muted); }

    .navlink{
      font-size:13px;
      color: var(--muted);
      padding: 8px 0;
      border-bottom: 2px solid transparent;
      transition:.14s ease;
      white-space:nowrap;
    }
    .navlink:hover{ color: var(--ink); border-bottom-color: rgba(240,32,0,.28); }
    .navlink.active{ color: var(--ink); border-bottom-color: var(--red); }

    .actions{ display:flex; align-items:center; gap:10px; min-width: 240px; justify-content:flex-end; }

    .search{
      width:min(260px, 34vw);
      border:1px solid var(--line2);
      background: var(--paper);
      border-radius: 999px;
      padding: 10px 12px;
      font-size: 13px;
      outline:none;
      transition:.14s ease;
    }
    .search:focus{ border-color: rgba(240,32,0,.40); box-shadow: 0 0 0 4px rgba(240,32,0,.08); }

    .btn{
      border:1px solid var(--ink);
      background: transparent;
      border-radius: 999px;
      padding: 10px 12px;
      font-size: 13px;
      cursor:pointer;
      transition:.14s ease;
      white-space:nowrap;
    }
    .btn:hover{ transform: translateY(-1px); }
    .btn.primary{ border-color: var(--red); color: var(--red); font-weight:800; }

    /* кнопка темы (как на главной) */
    .themeBtn{
      border-color: var(--line2);
      background: var(--paper);
      color: var(--ink);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding: 10px 12px;
      white-space:nowrap;
    }
    .themeBtn:hover{ transform: translateY(-1px); }
    .themeIcon{ width:18px; height:18px; display:block; }
    .themeLabel{
      font-weight:900;
      letter-spacing:.4px;
      font-size: 12px;
      color: var(--muted);
    }
    @media (min-width: 721px){
      .themeLabel{ display:none; }
      .themeBtn{ padding: 10px 11px; }
    }

    /* ===== БУРГЕР-МЕНЮ (как на главной) ===== */
    .nav-desktop{
      display:flex;
      align-items:center;
      gap:18px;
    }
    .nav-mobile{
      display:none;          /* на ПК скрыто */
      position:relative;
    }
    .burger{
      cursor:pointer;
      user-select:none;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid var(--line2);
      background: var(--paper);
      color: var(--ink);
      font-weight: 900;
      line-height: 1;
    }
    .burger::-webkit-details-marker{ display:none; }
    .burger::marker{ content:""; }

    .nav-panel{
      display:none;
      position:absolute;
      top: calc(100% + 10px);
      right: 0;
      min-width: min(320px, 92vw);

      padding: 12px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(0,0,0,.18);
      z-index: 50;

      flex-direction:column;
      gap:10px;
    }
    .nav-mobile[open] .nav-panel{ display:flex; }

    .nav-panel .navlink{
      color: var(--ink);
      padding: 10px 8px;
      border-bottom: 1px solid rgba(11,11,12,.06);
    }
    .nav-panel .navlink:last-child{ border-bottom: 0; }

    /* кнопка темы внутри моб.панели — во всю ширину */
    .nav-panel .themeBtn{
      width:100%;
      justify-content:center;
      border-color: var(--line2);
      background: rgba(11,11,12,.02);
    }

    main{ position:relative; z-index:1; padding: 24px 0 56px; }

    .kicker{
      display:flex; align-items:center; gap:10px;
      font-size:12px; letter-spacing:1.4px; text-transform:uppercase;
      color: var(--muted);
    }
    .kicker .dot{
      width:9px; height:9px; border-radius: 3px;
      background: var(--red);
    }

    /* ===== Layout: left materials + right feed (ПК как было) ===== */
    .layout{
      margin-top: 14px;
      display:grid;
      grid-template-columns: 1.35fr .9fr;
      gap: 14px;
      align-items:start;

      /* чтобы на мобилке можно было “перекинуть” ленту вверх */
      grid-template-areas: "left feed";
    }
    .leftcol{ grid-area:left; }
    .feed{ grid-area:feed; }

    /* ===== Filters (tabs) ===== */
    .controlbar{
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow2);
      padding: 10px 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      flex-wrap:wrap;
      margin-bottom: 14px;
    }
    .tabs{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .tab{
      font-size:13px;
      color: var(--muted);
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      transition:.14s ease;
      white-space:nowrap;
    }
    .tab:hover{ color: var(--ink); border-color: rgba(240,32,0,.18); background: rgba(240,32,0,.04); }
    .tab.active{ color: var(--ink); border-color: rgba(240,32,0,.22); background: rgba(240,32,0,.05); font-weight:900; }

    .hint{ font-size:13px; color: var(--muted); }

    /* ===== LEFT: big materials list ===== */
    .biglist{ display:flex; flex-direction:column; gap:14px; }

    .bigcard{
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow2);
      padding: 14px;
      transition:.14s ease;
      display:flex;
      flex-direction:column;
    }
    .bigcard:hover{ transform: translateY(-2px); border-color: rgba(240,32,0,.22); }

    .bigrow{
      display:grid;
      grid-template-columns: 240px 1fr;
      gap: 14px;
      align-items:start;
    }

    .thumb{
      border-radius: var(--r);
      border: 1px solid var(--line);
      background:
        radial-gradient(560px 220px at 20% 15%, rgba(240,32,0,.14), transparent 60%),
        linear-gradient(180deg, rgba(11,11,12,.05), rgba(11,11,12,.015));
      aspect-ratio: 16/10;
      box-shadow: var(--shadow2);
    }

    .top{
      display:flex; justify-content:space-between; gap:10px; font-size:12px; color:var(--muted);
      align-items:center;
      flex-wrap:wrap;
    }
    .rubric{
      display:inline-flex; align-items:center; gap:8px;
      font-weight: 900; color: var(--ink);
      letter-spacing:.2px;
    }
    .rubric:before{
      content:""; width:8px; height:8px; border-radius:2px; background: var(--red);
      display:inline-block;
    }
    .live{
      font-size:10px;
      font-weight:1000;
      letter-spacing:.9px;
      color: var(--red);
      border: 1px solid rgba(240,32,0,.28);
      background: rgba(240,32,0,.06);
      padding: 2px 6px;
      border-radius: 999px;
      margin-left:auto;
    }

    .bigcard h3{ margin:10px 0 10px; font-size:16px; line-height:1.2; }
    .desc{ margin:0; color: var(--muted); font-size:13px; line-height:1.55; }

    .chips{ margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; }
    .chip{
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--soft);
      background: rgba(11,11,12,.02);
      color: var(--muted);
    }
    .chip.hot{ border-color: rgba(240,32,0,.22); background: rgba(240,32,0,.05); color: var(--ink); font-weight:800; }

    /* ===== RIGHT: feed ===== */
    .feed{
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow2);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      min-height: 360px;
      position:sticky;
      top: 78px;
      max-height: calc(100vh - 96px);
    }
    .feed-head{
      padding: 12px 14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      border-bottom: 1px solid var(--line2);
      background: linear-gradient(180deg, rgba(11,11,12,.018), transparent);
    }
    .feed-title{
      display:flex; align-items:center; gap:10px;
      font-weight:900;
      letter-spacing:1.2px;
      text-transform:uppercase;
      font-size:12px;
    }
    .feed-title .pulse{
      width:9px; height:9px; border-radius:3px;
      background: var(--red);
      box-shadow: 0 0 0 6px rgba(240,32,0,.08);
    }
    .feed-actions{
      display:flex; gap:8px; align-items:center;
      font-size:12px;
      color: var(--muted);
      white-space:nowrap;
    }
    .feed-actions a{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(240,32,0,.20);
      background: rgba(240,32,0,.05);
      color: var(--red);
      font-weight:900;
      transition:.14s ease;
    }
    .feed-actions a:hover{ transform: translateY(-1px); background: rgba(240,32,0,.08); }

    .feed-list{
      padding: 6px 0;
      overflow:auto;
    }
    .feed-item{
      display:grid;
      grid-template-columns: 56px 1fr;
      gap: 10px;
      padding: 10px 14px;
      border-top: 1px solid rgba(11,11,12,.06);
      transition:.12s ease;
      cursor:pointer;
    }
    .feed-item:first-child{ border-top:0; }
    .feed-item:hover{ background: rgba(11,11,12,.02); }

    .t-time{
      font-size:12px;
      color: var(--muted2);
      font-variant-numeric: tabular-nums;
      padding-top: 1px;
    }
    .t-main{ display:flex; flex-direction:column; gap:4px; min-width:0; }
    .t-top{ display:flex; align-items:center; gap:8px; font-size:12px; color: var(--muted); }
    .t-dot{
      width:7px; height:7px; border-radius:2px;
      background: var(--red);
      display:inline-block;
      transform: translateY(1px);
    }
    .t-rubric{ font-weight:800; color: var(--ink); }
    .t-live{
      margin-left:auto;
      font-size:10px;
      font-weight:1000;
      letter-spacing:.9px;
      color: var(--red);
      border: 1px solid rgba(240,32,0,.28);
      background: rgba(240,32,0,.06);
      padding: 2px 6px;
      border-radius: 999px;
    }
    .t-title{
      font-size:13px;
      line-height:1.35;
      color: var(--ink);
      font-weight:700;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient: vertical;
      overflow:hidden;
    }

    /* ===== ARTICLE VIEW ===== */
    .article{
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow2);
      overflow:hidden;
      padding: 14px;
    }

    .articleHead{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:14px;
      margin-bottom: 12px;
    }
    .articleHead h2{ margin:0; font-size: 18px; letter-spacing:.2px; }
    .articleHead p{ margin:0; font-size: 13px; color: var(--muted); }

    .more{
      font-size: 13px;
      color: var(--red);
      font-weight: 900;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(240,32,0,.22);
      background: rgba(240,32,0,.05);
      transition:.14s ease;
      white-space:nowrap;
      cursor:pointer;
    }
    .more:hover{ transform: translateY(-1px); background: rgba(240,32,0,.08); }

    .media{
      margin-top: 10px;
      border-radius: var(--r);
      border: 1px solid var(--line);
      background:
        radial-gradient(760px 300px at 22% 12%, rgba(240,32,0,.20), transparent 60%),
        linear-gradient(180deg, rgba(11,11,12,.05), rgba(11,11,12,.015));
      aspect-ratio: 16/9;
      box-shadow: var(--shadow2);
    }
    .caption{
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted2);
      line-height: 1.55;
    }

    .articleTitle{
      margin: 12px 0 10px;
      font-size: clamp(28px, 3.0vw, 44px);
      line-height: 1.05;
      letter-spacing: .15px;
      font-weight: 1000;
    }
    .articleLead{
      margin:0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.65;
      max-width: 72ch;
    }

    .meta{
      margin-top: 12px;
      display:flex; flex-wrap:wrap; gap:10px 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .meta span{
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--soft);
      background: rgba(11,11,12,.02);
      color: var(--muted);
    }
    .meta span strong{ color: var(--ink); }

    .toolbar{
      margin-top: 12px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .body{
      margin-top: 12px;
      border-top: 1px solid rgba(11,11,12,.06);
      padding-top: 12px;
    }
    .body p{
      margin:0 0 12px;
      font-size: 15px;
      line-height: 1.75;
      color: var(--ink);
      max-width: 78ch;
    }
    .body p.small{
      font-size:13px;
      color: var(--muted);
    }

    .related{
      margin-top: 14px;
      border-top: 1px solid rgba(11,11,12,.06);
      padding-top: 14px;
    }

    .relGrid{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
      margin-top: 12px;
    }
    .relCard{
      grid-column: span 6;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 14px;
      box-shadow: var(--shadow2);
      transition:.14s ease;
      cursor:pointer;
    }
    .relCard:hover{ transform: translateY(-2px); border-color: rgba(240,32,0,.22); }
    .relCard .top{ display:flex; justify-content:space-between; gap:10px; font-size:12px; color:var(--muted); }
    .relCard h3{ margin:10px 0 10px; font-size:16px; line-height:1.2; }

    footer{
      margin-top: 34px;
      border-top: 1px solid var(--line);
      padding: 18px 0;
      color: var(--muted);
      font-size: 12px;
      display:flex;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
    }

    /* ===== Responsive ===== */
    @media (max-width: 980px){
      /* мобильная/планшет: Лента ВВЕРХУ и с неё начинается страница */
      .layout{
        grid-template-columns: 1fr;
        grid-template-areas:
          "feed"
          "left";
      }
      .feed{
        position:relative;
        top:auto;
        max-height:none;
        min-height:auto;
      }

      /* убрать поиск на мобильной версии */
      .actions .search{ display:none; }
    }

    @media (max-width: 980px){
      .bigrow{ grid-template-columns: 1fr; }
      .relCard{ grid-column: span 12; }
    }

    @media (max-width: 720px){
      .brand{ min-width:auto; }

      /* мобилка: выключаем десктоп-меню, включаем бургер */
      .nav-desktop{ display:none; }
      .nav-mobile{ display:block; }

      /* ✅ как на главной: в шапке на мобилке кнопку темы убираем полностью */
      .actions .themeBtn{ display:none; }

      .actions{ min-width:auto; }
    }

    @media (prefers-reduced-motion: reduce){
      *{ transition:none !important; }
      .feed-actions a:hover,.more:hover,.btn:hover,.bigcard:hover,.relCard:hover{ transform:none !important; }
    }
  </style>
</head>

<body>
  <div class="grid" aria-hidden="true"></div>

  <header>
    <div class="container">
      <div class="topbar">
        <a class="brand" href="index.html">
          <img src="ПР_PNG.png" alt="Промышленный репортёр" />
          <div class="t">
            <strong>Промышленный репортёр</strong>
            <span>индустрия · экономика · технологии</span>
          </div>
        </a>

        <!-- ДЕСКТОП-МЕНЮ (ПК) -->
        <nav class="nav-desktop" aria-label="Меню">
          <a class="navlink" href="index.html">Главная</a>
          <a class="navlink active" href="news.html">Новости</a>
          <a class="navlink" href="tv.html">TV</a>
          <a class="navlink" href="production.html">Продакшн</a>
          <a class="navlink" href="editorial.html">Редакция</a>
        </nav>

        <!-- МОБИЛЬНОЕ МЕНЮ (бургер) -->
        <details class="nav-mobile">
          <summary class="burger" aria-label="Открыть меню"><span aria-hidden="true">≡</span></summary>

          <nav class="nav-panel" aria-label="Меню">
            <a class="navlink" href="index.html">Главная</a>
            <a class="navlink active" href="news.html">Новости</a>
            <a class="navlink" href="tv.html">TV</a>
            <a class="navlink" href="production.html">Продакшн</a>
            <a class="navlink" href="editorial.html">Редакция</a>

            <!-- ✅ Единственная кнопка темы на мобилке — тут, внизу бургер-меню -->
            <button class="btn themeBtn" type="button" data-theme-toggle aria-pressed="false" aria-label="Переключить тему">
              <svg class="themeIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
              <span class="themeLabel"></span>
            </button>
          </nav>
        </details>

        <!-- ШАПКА (ПК) -->
        <div class="actions">
          <input class="search" id="headerSearch" placeholder="Поиск…" aria-label="Поиск по материалам и ленте" />
          <!-- ✅ Кнопка темы на ПК остаётся в шапке -->
          <button class="btn themeBtn" type="button" data-theme-toggle aria-pressed="false" aria-label="Переключить тему">
            <svg class="themeIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
            <span class="themeLabel">Тема</span>
          </button>
        </div>

      </div>
    </div>
  </header>

  <main class="container">

    // ===== Helpers =====
    function nowHHMM(){
      const d = new Date();
      const hh = String(d.getHours()).padStart(2,'0');
      const mm = String(d.getMinutes()).padStart(2,'0');
      return `${hh}:${mm}`;
    }

    function escapeHtml(s){
      return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function matchesFilter(a){
      const tabOk = (state.tab === "all") || (a.tab === state.tab);
      const liveOk = !state.liveOnly || a.live;
      const q = state.query.trim().toLowerCase();
      const qOk = !q || (a.title.toLowerCase().includes(q) || a.lead.toLowerCase().includes(q) || a.rubric.toLowerCase().includes(q));
      return tabOk && liveOk && qOk;
    }

    function relatedFor(article){
      const sameTab = ARTICLES.filter(a => a.id !== article.id && a.tab === article.tab);
      const byTags = ARTICLES.filter(a => a.id !== article.id && a.tab !== article.tab && a.tags.some(t => article.tags.includes(t)));
      const merged = [...sameTab, ...byTags];

      const uniq = [];
      const seen = new Set();
      for(const a of merged){
        if(!seen.has(a.id)){ seen.add(a.id); uniq.push(a); }
      }
      return uniq.slice(0, 4);
    }

    // ===== Render list (left big materials) =====
    function renderList(){
      const items = ARTICLES.filter(matchesFilter);

      pageTitle.textContent = state.selectedId ? "Статья" : "Новости";
      leftHint.textContent = state.selectedId
        ? "Полная статья · внизу будут похожие материалы"
        : `Большие материалы · ${items.length} шт.`;

      if(state.selectedId){
        listView.style.display = "none";
        articleView.style.display = "block";
        renderArticle(state.selectedId);
        return;
      }

      articleView.style.display = "none";
      listView.style.display = "flex";

      if(items.length === 0){
        listView.innerHTML = `

          </div>

          openArticle(el.dataset.open);
        });
      });
    }

    // ===== Render article (full) =====
    function renderArticle(id){
      const a = ARTICLES.find(x => x.id === id);
      if(!a){
        state.selectedId = null;
        renderList();
        return;
      }

      const rel = relatedFor(a);

      articleView.innerHTML = `
        <div class="articleHead">
          <div>
            <h2>${escapeHtml(a.rubric)}</h2>

        <div class="articleTitle">${escapeHtml(a.title)}</div>

          <span><strong>${escapeHtml(a.rubric)}</strong></span>

      articleView.querySelector("#backBtn").addEventListener("click", ()=>{
        state.selectedId = null;
        renderList();
        window.scrollTo({top: 0, behavior: "smooth"});

      articleView.querySelector("#shareBtn").addEventListener("click", ()=>{

      articleView.querySelector("#saveBtn").addEventListener("click", ()=>{
        alert("Сохранено (мок).");

        try{
          await navigator.clipboard.writeText(fakeUrl);

        el.addEventListener("click", ()=> openArticle(el.dataset.open));

          if(e.key === "Enter" || e.key === " "){
            e.preventDefault();
            openArticle(el.dataset.open);

      feedList.innerHTML = show.map(n => `

          <div class="t-time">${escapeHtml(n.time)}</div>
          <div class="t-main">
            <div class="t-top">
              <span class="t-dot"></span>
              <span class="t-rubric">${escapeHtml(n.rubric)}</span>
              ${n.live ? `<span class="t-live">LIVE</span>` : ``}

            <div class="t-title">${escapeHtml(n.title)}</div>

      `).join("");

      feedList.querySelectorAll("[data-open]").forEach(el=>{
        el.addEventListener("click", ()=> openArticle(el.dataset.open));
      });
    }

    // simulate updates
    setInterval(()=>{
      const pick = FEED_POOL[Math.floor(Math.random()*FEED_POOL.length)];
      const fallback = ARTICLES.find(a => a.tab === pick.tab) || ARTICLES[0];
      feedItems.unshift({
        id: fallback.id,
        time: nowHHMM(),
        rubric: pick.rubric,
        title: pick.title,
        live: pick.live
      });
      feedItems = feedItems.slice(0, 16);
      renderFeed();

      feedStatus.textContent = "обновлено сейчас";
      setTimeout(()=>feedStatus.textContent="обновляется", 1800);
    }, 12000);

    // ===== UI wiring =====
    document.querySelectorAll(".tab").forEach(el=>{
      el.addEventListener("click",(e)=>{
        e.preventDefault();
        document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
        el.classList.add("active");
        state.tab = el.dataset.tab;
        state.selectedId = null;
        renderList();
        renderFeed();
      });
    });

      e.preventDefault();
      state.liveOnly = !state.liveOnly;
      liveToggle.textContent = state.liveOnly ? "Все" : "Только LIVE";
      renderFeed();
      if(!state.selectedId) renderList();
    });

    // Header search (ПК). На мобилке скрыт CSS-ом.
    headerSearch.addEventListener("input",(e)=>{
      state.query = e.target.value || "";
      if(!state.selectedId) renderList();
      renderFeed();

    headerSearch.addEventListener("keydown",(e)=>{
      if(e.key === "Escape"){
        headerSearch.value = "";
        state.query = "";
        if(!state.selectedId) renderList();
        renderFeed();
      }
    });

    // init
    renderList();
    renderFeed();

  <script>
    (function(){

      if(!d) return;

      d.querySelectorAll('a').forEach(a=>{

      document.addEventListener('click', (e)=>{
        if(d.hasAttribute('open') && !d.contains(e.target)){

      });
    })();

      const toggles = Array.from(document.querySelectorAll("[data-theme-toggle]"));

      const ICON_MOON = `<path fill="currentColor" d="M21.4 13.1a8.9 8.9 0 0 1-10.5-10.5A9.6 9.6 0 1 0 21.4 13.1Z"/>`;
      const ICON_SUN = `<path fill="currentColor" d="M12 18.2a6.2 6.2 0 1 1 0-12.4a6.2 6.2 0 0 1 0 12.4Zm0-14.9a1 1 0 0 1 1 1v1.2a1 1 0 1 1-2 0V4.3a1 1 0 0 1 1-1Zm0 16.2a1 1 0 0 1 1 1v1.2a1 1 0 1 1-2 0v-1.2a1 1 0 0 1 1-1ZM4.3 11a1 1 0 1 1 0 2H3.1a1 1 0 1 1 0-2h1.2Zm17.8 0a1 1 0 1 1 0 2h-1.2a1 1 0 1 1 0-2h1.2ZM6 5.6a1 1 0 0 1 1.4 0l.8.8a1 1 0 1 1-1.4 1.4l-.8-.8a1 0 0 1 0-1.4Zm11.2 11.2a1 1 0 0 1 1.4 0l.8.8a1 1 0 1 1-1.4 1.4l-.8-.8a1 0 0 1 0-1.4ZM18.4 5.6a1 1 0 0 1 0 1.4l-.8.8a1 1 0 1 1-1.4-1.4l.8-.8a1 0 0 1 1.4 0ZM7.8 16.2a1 1 0 0 1 0 1.4l-.8.8a1 1 0 1 1-1.4-1.4l.8-.8a1 0 0 1 1.4 0Z"/>`;

      function currentTheme() {
        return root.getAttribute("data-theme") === "dark" ? "dark" : "light";
      }

      function setIconAndLabel(btn, theme){
        const svg = btn.querySelector("svg");
        if (!svg) return;

        const isDark = theme === "dark";
        svg.innerHTML = isDark ? ICON_SUN : ICON_MOON;
        btn.setAttribute("aria-label", isDark ? "Включить светлую тему" : "Включить тёмную тему");

        const label = btn.querySelector(".themeLabel");
        if(label){
          label.textContent = isDark ? "Свет" : "Тема";
        }
      }

      function apply(theme) {
        if (theme === "dark") root.setAttribute("data-theme", "dark");
        else root.removeAttribute("data-theme");

        toggles.forEach(btn => {
          const isDark = theme === "dark";
          btn.setAttribute("aria-pressed", isDark ? "true" : "false");
          setIconAndLabel(btn, theme);
        });
      }

      toggles.forEach(btn => {
        btn.addEventListener("click", () => {
          const next = currentTheme() === "dark" ? "light" : "dark";
          localStorage.setItem(KEY, next);
          apply(next);
        });
      });

      apply(localStorage.getItem(KEY) || currentTheme());
    })();
  </script>
</body>
</html>
