<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TV — Промышленный репортёр</title>

  <script>
    (function () {
      const key = "theme";
      const saved = localStorage.getItem(key);
      const systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = saved || (systemDark ? "dark" : "light");
      if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
    })();
  </script>

  <style>
    :root{
      --bg:#f4f5f6;
      --paper:#ffffff;
      --ink:#0b0b0c;
      --muted:#5a5a61;
      --muted2:#7a7a83;
      --line:rgba(11,11,12,.12);
      --line2:rgba(11,11,12,.08);
      --soft:rgba(11,11,12,.05);
      --red:#f02000;
      --max:1160px;
      --pad:22px;
      --r:16px;
      --shadow2: 0 10px 18px rgba(11,11,12,.06);
      --headerBg: rgba(244,245,246,.92);
      --grid1: rgba(0,0,0,.028);
      --grid2: rgba(0,0,0,.024);
    }

    html[data-theme="dark"]{
      --bg:#0b0b0c;
      --paper:#101214;
      --ink:#f4f5f6;
      --muted:rgba(244,245,246,.70);
      --muted2:rgba(244,245,246,.58);
      --line:rgba(255,255,255,.12);
      --line2:rgba(255,255,255,.08);
      --soft:rgba(255,255,255,.06);
      --red:#ff2a2a;
      --shadow2: 0 10px 18px rgba(0,0,0,.32);
      --headerBg: rgba(11,11,12,.72);
      --grid1: rgba(255,255,255,.06);
      --grid2: rgba(255,255,255,.05);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--ink);
      letter-spacing:.15px;
      text-rendering: geometricPrecision;
    }
    a{ color:inherit; text-decoration:none; }
    .container{ width:min(var(--max), calc(100% - var(--pad)*2)); margin:0 auto; }
    html, body { transition: background-color .18s ease, color .18s ease; }
    *{ transition: background-color .18s ease, color .18s ease, border-color .18s ease; }

    .grid{
      position:fixed; inset:0; pointer-events:none; z-index:0;
      background:
        linear-gradient(to right, var(--grid1) 1px, transparent 1px) 0 0/ 84px 84px,
        linear-gradient(to bottom, var(--grid2) 1px, transparent 1px) 0 0/ 84px 84px;
      mask-image: radial-gradient(ellipse at 50% 0%, black 32%, transparent 72%);
      opacity:.45;
    }

    header{
      position:sticky; top:0; z-index:10;
      background: var(--headerBg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .topbar{
      display:flex; align-items:center; justify-content:space-between; gap:16px;
      padding: 14px 0;
    }
    .brand{ display:flex; align-items:center; gap:12px; min-width: 260px; }
    .brand img{ width:44px; height:44px; object-fit:contain; display:block; }
    .brand .t{ display:flex; flex-direction:column; line-height:1.05; }
    .brand .t strong{ text-transform:uppercase; font-size:13px; letter-spacing:1.7px; }
    .brand .t span{ font-size:12px; color: var(--muted); }

    .navlink{
      font-size:13px;
      color: var(--muted);
      padding: 8px 0;
      border-bottom: 2px solid transparent;
      transition:.14s ease;
      white-space:nowrap;
    }
    .navlink:hover{ color: var(--ink); border-bottom-color: rgba(240,32,0,.28); }
    .navlink.active{ color: var(--ink); border-bottom-color: var(--red); }

    .actions{ display:flex; align-items:center; gap:10px; min-width: 240px; justify-content:flex-end; }
    .search{
      width:min(260px, 34vw);
      border:1px solid var(--line2);
      background: var(--paper);
      border-radius: 999px;
      padding: 10px 12px;
      font-size: 13px;
      outline:none;
      transition:.14s ease;
    }

    .btn{
      border:1px solid var(--ink);
      background: transparent;
      border-radius: 999px;
      padding: 10px 12px;
      font-size: 13px;
      cursor:pointer;
      transition:.14s ease;
      color: var(--ink);
    }
    .btn.primary{ border-color: var(--red); color: var(--red); font-weight:800; }

    .themeBtn{
      border-color: var(--line2);
      background: var(--paper);
      color: var(--ink);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding: 10px 12px;
      white-space:nowrap;
    }
    .themeIcon{ width:18px; height:18px; display:block; }
    @media (min-width: 721px){
      .themeBtn{ padding: 10px 11px; }
    }

    /* ===== БУРГЕР-МЕНЮ (как в index) ===== */
    .nav-desktop{
      display:flex;
      align-items:center;
      gap:18px;
    }
    .nav-mobile{
      display:none;
      position:relative;
    }
    .burger{
      cursor:pointer;
      user-select:none;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid var(--line2);
      background:var(--paper);
      color:var(--ink);
      font-weight:900;
      line-height:1;
    }
    .burger::-webkit-details-marker{ display:none; }
    .burger::marker{ content:""; }

    .nav-panel{
      display:none;
      position:absolute;
      top:calc(100% + 10px);
      right:0;
      min-width:min(320px, 92vw);
      padding:12px;
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:0 18px 40px rgba(0,0,0,.18);
      z-index:50;
      flex-direction:column;
      gap:10px;
    }
    .nav-mobile[open] .nav-panel{ display:flex; }

    .nav-panel .navlink{
      color:var(--ink);
      padding:10px 8px;
      border-bottom:1px solid rgba(11,11,12,.06);
    }
    .nav-panel .navlink:last-child{ border-bottom:0; }

    .nav-panel .themeBtn{
      width:100%;
      justify-content:center;
      border-color:var(--line2);
      background:rgba(11,11,12,.02);
    }

    main{ position:relative; z-index:1; padding: 18px 0 56px; }

    .kicker{
      display:flex; align-items:center; gap:10px;
      font-size:12px; letter-spacing:1.4px; text-transform:uppercase;
      color: var(--muted);
    }
    .kicker .dot{
      width:9px; height:9px; border-radius: 3px;
      background: var(--red);
    }

    .section{ margin-top: 18px; }
    .section-head{
      display:flex; justify-content:space-between; align-items:flex-end; gap:14px;
      margin-bottom: 12px;
    }
    .section-head h2{ margin:0; font-size: 18px; letter-spacing:.2px; }
    .section-head p{ margin:0; font-size: 13px; color: var(--muted); }
    .more{
      font-size: 13px;
      color: var(--red);
      font-weight: 900;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(240,32,0,.22);
      background: rgba(240,32,0,.05);
      transition:.14s ease;
      white-space:nowrap;
    }

    .vod{
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 14px;
      align-items:stretch;
    }
    .player{
      border-radius: var(--r);
      border: 1px solid var(--line);
      background:
        radial-gradient(560px 220px at 20% 15%, rgba(240,32,0,.14), transparent 60%),
        linear-gradient(180deg, rgba(11,11,12,.05), rgba(11,11,12,.015));
      aspect-ratio: 16/9;
      display:grid; place-items:center;
      box-shadow: var(--shadow2);
      position:relative;
      overflow:hidden;
    }
    .player .cover{
      position:absolute; inset:0;
      background-size:cover;
      background-position:center;
      filter: contrast(1.02) saturate(.98);
      opacity:.95;
    }
    .player:before{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.28));
      pointer-events:none;
    }
    .player .label{
      position:absolute; top:12px; left:12px;
      display:inline-flex; align-items:center; gap:8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(240,32,0,.22);
      background: rgba(240,32,0,.06);
      color: var(--ink);
      font-size: 12px;
      font-weight: 900;
      letter-spacing:.6px;
      text-transform:uppercase;
      z-index:2;
    }
    .player .label i{ width:7px; height:7px; border-radius:2px; background: var(--red); display:inline-block; }
    .play{
      width:74px; height:74px;
      border-radius: 22px;
      border: 1px solid rgba(240,32,0,.36);
      background: rgba(240,32,0,.12);
      cursor:pointer;
      transition:.14s ease;
      display:grid; place-items:center;
      z-index:2;
      color: var(--ink);
      backdrop-filter: blur(6px);
    }

    .vinfo{
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow2);
      padding: 14px;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-width:0;
    }
    .vinfo b{ font-size: 16px; line-height:1.25; }
    .vinfo p{ margin:0; color: var(--muted); font-size:13px; line-height:1.6; }
    .meta{ margin-top: 6px; display:flex; flex-wrap:wrap; gap:8px; font-size: 12px; color: var(--muted); }
    .tag{ padding: 6px 10px; border-radius: 999px; border: 1px solid var(--soft); background: rgba(11,11,12,.02); white-space:nowrap; }
    .tag.hot{ border-color: rgba(240,32,0,.22); background: rgba(240,32,0,.05); color: var(--ink); font-weight:800; }

    .vinfo .btn{
      border-color: var(--line);
      background: rgba(11,11,12,.03);
      color: var(--ink);
    }
    .vinfo .btn.primary{
      background: rgba(240,32,0,.10);
      border-color: rgba(240,32,0,.45);
      color: var(--red);
    }
    html[data-theme="dark"] .vinfo .btn{
      background: rgba(255,255,255,.06);
      border-color: rgba(255,255,255,.18);
      color: #ffffff;
    }
    html[data-theme="dark"] .vinfo .btn.primary{
      background: rgba(255,42,42,.18);
      border-color: rgba(255,42,42,.55);
      color: var(--red);
    }

    .panel{
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow2);
      overflow:hidden;
    }
    .panel-head{
      padding: 12px 14px;
      border-bottom: 1px solid var(--line2);
      background: linear-gradient(180deg, rgba(11,11,12,.018), transparent);
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:14px;
    }
    .panel-head .left b{
      display:block;
      font-size: 12px;
      letter-spacing:1.2px;
      text-transform:uppercase;
      color: var(--muted);
    }
    .panel-head .left span{
      display:block;
      margin-top:6px;
      font-size: 13px;
      color: var(--muted);
    }
    .panel-body{ padding: 12px 14px 14px; }

    .filters-top{
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:space-between;
      margin-bottom: 12px;
    }
    .searchline{
      flex: 1 1 320px;
      min-width: 240px;
      border:1px solid var(--line2);
      background: var(--paper);
      border-radius: 999px;
      padding: 10px 12px;
      font-size: 13px;
      outline:none;
    }
    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      justify-content:flex-end;
    }
    .chip{
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid var(--line2);
      background: var(--paper);
      color: var(--muted);
      cursor:pointer;
      user-select:none;
      white-space:nowrap;
    }
    .chip.active{
      color: var(--ink);
      font-weight:900;
      border-color: rgba(240,32,0,.22);
      background: rgba(240,32,0,.05);
    }

    .grid-videos{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
    }
    .vcard{
      grid-column: span 4;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r);
      overflow:hidden;
      box-shadow: var(--shadow2);
      display:flex;
      flex-direction:column;
      min-height: 240px;
    }
    .thumb{
      aspect-ratio: 16/9;
      border-bottom: 1px solid var(--line2);
      position:relative;
      display:grid; place-items:center;
      overflow:hidden;
      background:
        radial-gradient(560px 220px at 20% 15%, rgba(240,32,0,.14), transparent 60%),
        linear-gradient(180deg, rgba(11,11,12,.06), rgba(11,11,12,.02));
    }
    .thumb .cover{
      position:absolute; inset:0;
      background-size:cover;
      background-position:center;
      opacity:.95;
    }
    .thumb:before{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,.00), rgba(0,0,0,.28));
      pointer-events:none;
    }
    .thumb .p{
      position:relative;
      width:54px; height:54px;
      border-radius: 18px;
      border: 1px solid rgba(240,32,0,.36);
      background: rgba(240,32,0,.12);
      display:grid; place-items:center;
      z-index:1;
      backdrop-filter: blur(6px);
    }
    .vbody{
      padding: 12px 14px 14px;
      display:flex;
      flex-direction:column;
      gap:8px;
      min-width:0;
      flex:1;
    }
    .vtop{
      display:flex; justify-content:space-between; gap:10px;
      font-size:12px; color: var(--muted);
    }
    .vrub{
      display:inline-flex; align-items:center; gap:8px;
      font-weight:900; color: var(--ink);
    }
    .vrub:before{
      content:""; width:8px; height:8px; border-radius:2px; background: var(--red);
      display:inline-block;
    }
    .vtitle{
      font-size: 14.5px;
      font-weight: 900;
      line-height: 1.25;
      display:-webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:hidden;
    }
    .vdesc{
      margin:0;
      color: var(--muted);
      font-size: 13px;
      line-height:1.6;
      display:-webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:hidden;
    }
    .vmeta{
      margin-top:auto;
      display:flex; gap:8px; flex-wrap:wrap;
      font-size: 12px; color: var(--muted);
    }

    footer{
      margin-top: 34px;
      border-top: 1px solid var(--line);
      padding: 18px 0;
      color: var(--muted);
      font-size: 12px;
      display:flex;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
    }

    /* Modal */
    .modal{
      position:fixed; inset:0;
      display:none;
      align-items:center;
      justify-content:center;
      background: rgba(0,0,0,.62);
      z-index:999;
      padding: 22px;
    }
    .modal.open{ display:flex; }
    .modal-card{
      width:min(980px, 100%);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow:hidden;
      box-shadow: 0 22px 60px rgba(0,0,0,.35);
    }
    .modal-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line2);
    }
    .modal-head b{ font-size: 13px; }
    .modal-close{
      border:1px solid var(--line2);
      background: var(--paper);
      border-radius: 999px;
      padding: 8px 10px;
      cursor:pointer;
      color: var(--ink);
    }
    .modal-player{
      aspect-ratio: 16/9;
      background:#000;
      position:relative;
    }
    .modal-player iframe{
      position:absolute; inset:0;
      width:100%; height:100%;
      border:0;
    }

    @media (max-width: 980px){
      .actions .search{ display:none; }
      .vod{ grid-template-columns: 1fr; }
      .vcard{ grid-column: span 6; }
      .chips{ justify-content:flex-start; }
    }
    @media (max-width: 720px){
      .vcard{ grid-column: span 12; }

      /* как на index: на мобиле скрываем десктоп-меню и показываем бургер */
      .nav-desktop{ display:none; }
      .nav-mobile{ display:block; }

      /* кнопку темы в шапке на мобиле убираем */
      .actions .themeBtn{ display:none; }

      .actions{ min-width:auto; }

      /* ✅ На мобильной версии скрываем "Видео дня", чтобы сразу открывался каталог */
      .vod-day{ display:none; }
    }
    @media (prefers-reduced-motion: reduce){
      *{ transition:none !important; }
    }
  </style>
</head>

<body>
  <div class="grid" aria-hidden="true"></div>

  <header>
    <div class="container">
      <div class="topbar">
        <a class="brand" href="index.html">
          <img src="log.png" alt="Промышленный репортёр" />
          <div class="t">
            <strong>Промышленный репортёр</strong>
          </div>
        </a>

        <!-- ДЕСКТОП-МЕНЮ (ПК) -->
        <nav class="nav-desktop" aria-label="Меню">
          <a class="navlink" href="index.html">Главная</a>
          <a class="navlink" href="news.html">Новости</a>
          <a class="navlink active" href="tv.html">TV</a>
          <a class="navlink" href="production.html">Продакшн</a>
          <a class="navlink" href="editorial.html">Редакция</a>
        </nav>

        <!-- МОБИЛЬНОЕ МЕНЮ (бургер) -->
        <details class="nav-mobile">
          <summary class="burger" aria-label="Открыть меню"><span aria-hidden="true">≡</span></summary>

          <nav class="nav-panel" aria-label="Меню">
            <a class="navlink" href="index.html">Главная</a>
            <a class="navlink" href="news.html">Новости</a>
            <a class="navlink active" href="tv.html">TV</a>
            <a class="navlink" href="production.html">Продакшн</a>
            <a class="navlink" href="editorial.html">Редакция</a>

            <button class="btn themeBtn" type="button" data-theme-toggle aria-pressed="false" aria-label="Переключить тему">
              <svg class="themeIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
              <span class="themeLabel">Тема</span>
            </button>
          </nav>
        </details>

        <div class="actions">
          <input class="search" placeholder="Поиск…" aria-label="Поиск" />
          <button class="btn themeBtn" type="button" data-theme-toggle aria-pressed="false" aria-label="Переключить тему">
            <svg class="themeIcon" viewBox="0 0 24 24" aria-hidden="true"></svg>
            <span class="themeLabel"></span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="kicker"><span class="dot"></span><span>TV</span></div>

    <section class="section vod-day" aria-label="Видео дня">
      <div class="section-head">
        <div>
          <h2>Видео дня</h2>
        </div>
      </div>

      <div class="vod">
        <div class="player" id="vodPlayer">
          <div class="cover" id="vodCover" style="display:none;"></div>
          <div class="label"><i></i> В эфире</div>
          <button class="play" id="vodPlay" type="button" aria-label="Смотреть видео дня">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M9 7v10l9-5-9-5Z" fill="currentColor"/>
            </svg>
          </button>
        </div>

        <div class="vinfo">
          <div class="kicker"><span class="dot"></span><span id="vodDur">VK</span></div>
          <b id="vodTitle">—</b>
          <p id="vodDesc">Загрузка…</p>
          <div class="meta">
            <span class="tag hot" id="vodRub">TV</span>
            <span class="tag" id="vodWhen">—</span>
            <span class="tag" id="vodLen">—</span>
            <span class="tag" id="vodViews">—</span>
          </div>

          <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:4px;">
            <button class="btn primary" type="button" id="vodOpen">Смотреть</button>
            <a class="btn" href="#" id="vodMaterial">Открыть в VK</a>
            <button class="btn" type="button" id="vodShare">Поделиться</button>
          </div>
        </div>
      </div>
    </section>

    <section class="section" aria-label="Архив видео">
      <div class="section-head">
        <div>
          <h2>Все видео</h2>
        </div>
        <a class="more" href="#" id="loadMore">Показать ещё →</a>
      </div>

      <div class="panel" aria-label="Каталог видео">
        <div class="panel-head">
          <div class="left">
            <b>Каталог</b>
            <span id="updatedLabel">—</span>
          </div>
          <span style="font-size:12px; color:var(--muted);" id="countLabel">0</span>
        </div>

        <div class="panel-body">
          <div class="filters-top" aria-label="Фильтры">
            <input id="vQ" class="searchline" placeholder="Поиск по видео…" />
            <div class="chips" id="rubChips" aria-label="Рубрики">
              <span class="chip active" data-rub="all">Все</span>
              <span class="chip" data-rub="TV">TV</span>
            </div>
          </div>

          <div class="grid-videos" id="gridVideos"></div>
        </div>
      </div>
    </section>

    <footer>
      <div>© <span id="y"></span> Промышленный репортёр</div>
      <div>Контакты · Реклама · Политика</div>
    </footer>
  </main>

  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="Просмотр видео">
      <div class="modal-head">
        <b id="modalTitle">Видео</b>
        <button class="modal-close" id="modalClose" type="button">Закрыть</button>
      </div>
      <div class="modal-player" id="modalPlayer"></div>
    </div>
  </div>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();

    const state = { q:"", rub:"all" };
    let allVideos = [];
    let shown = 0;
    const pageSize = 12;

    const vQ = document.getElementById('vQ');
    const grid = document.getElementById('gridVideos');
    const loadMore = document.getElementById('loadMore');
    const countLabel = document.getElementById('countLabel');
    const updatedLabel = document.getElementById('updatedLabel');

    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalPlayer = document.getElementById('modalPlayer');
    const modalClose = document.getElementById('modalClose');

    function fmtViews(n){
      const num = Number(n || 0);
      if(num >= 1000000) return (num/1000000).toFixed(1).replace('.0','') + "M";
      if(num >= 1000) return Math.round(num/1000) + "k";
      return String(num);
    }

    function fmtDate(ts){
      if(!ts) return "—";
      const d = new Date(Number(ts) * 1000);
      if (Number.isNaN(d.getTime())) return "—";
      return d.toISOString().slice(0,10);
    }

    function fmtDur(sec) {
      if (typeof sec === "string" && sec.includes(":")) return sec;
      const s = Number(sec);
      if (!Number.isFinite(s) || s < 0) return "";
      const total = Math.floor(s);
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const r = total % 60;
      if (h > 0) return `${h}:${String(m).padStart(2, "0")}:${String(r).padStart(2, "0")}`;
      return `${m}:${String(r).padStart(2, "0")}`;
    }

    function openVideo(item){
      if(!item || !item.embedUrl){
        window.open(item?.href || "https://vk.com/promrep", "_blank");
        return;
      }
      modalTitle.textContent = item.title || "Видео";
      modalPlayer.innerHTML = `
        <iframe
          src="${item.embedUrl}${item.embedUrl.includes('?') ? '&' : '?'}autoplay=1"
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
          allowfullscreen
        ></iframe>
      `;
      modal.classList.add("open");
      modal.setAttribute("aria-hidden","false");
    }

    function closeModal(){
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden","true");
      modalPlayer.innerHTML = "";
    }

    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e)=>{ if(e.target === modal) closeModal(); });
    document.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeModal(); });

    function matches(v){
      const q = state.q.trim().toLowerCase();
      const okQ = !q ||
        (v.title||"").toLowerCase().includes(q) ||
        (v.description||"").toLowerCase().includes(q);
      const okR = state.rub === "all" ? true : (v.rubric || "TV") === state.rub;
      return okQ && okR;
    }

    function renderArchive(reset){
      if(reset){
        shown = 0;
        grid.innerHTML = "";
        loadMore.style.display = "";
      }

      const filtered = allVideos.filter(matches);
      countLabel.textContent = `${filtered.length} материалов`;

      const slice = filtered.slice(shown, shown + pageSize);
      shown += slice.length;

      grid.insertAdjacentHTML('beforeend', slice.map(v => {
        const dur = fmtDur(v.duration);
        return `
          <a class="vcard" href="#" data-id="${v.ownerId}_${v.id}" aria-label="${(v.title||"").replaceAll('"','&quot;')}">
            <div class="thumb">
              ${v.thumb ? `<div class="cover" style="background-image:url('${v.thumb}')"></div>` : ``}
              <div class="p" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                  <path d="M9 7v10l9-5-9-5Z" fill="currentColor"/>
                </svg>
              </div>
            </div>
            <div class="vbody">
              <div class="vtop">
                <span class="vrub">TV</span>
                <span>${fmtViews(v.views)} просмотров</span>
              </div>
              <div class="vtitle">${v.title || "Без названия"}</div>
              <p class="vdesc">${v.description || ""}</p>
              <div class="vmeta">
                <span class="tag">${fmtDate(v.date)}</span>
                ${dur ? `<span class="tag hot">${dur}</span>` : ``}
              </div>
            </div>
          </a>
        `;
      }).join(''));

      if(shown >= filtered.length) loadMore.style.display = "none";

      if(filtered.length === 0){
        grid.innerHTML = `<div style="grid-column:1/-1; color:var(--muted); font-size:13px; padding:6px 2px;">
          Ничего не найдено. Попробуйте другой запрос.
        </div>`;
        loadMore.style.display = "none";
      }
    }

    grid.addEventListener("click",(e)=>{
      const a = e.target.closest("a.vcard");
      if(!a) return;
      e.preventDefault();
      const key = a.dataset.id;
      const item = allVideos.find(x => `${x.ownerId}_${x.id}` === key);
      if(item) openVideo(item);
    });

    document.getElementById('rubChips').addEventListener('click', (e)=>{
      const chip = e.target.closest('.chip');
      if(!chip) return;
      document.querySelectorAll('#rubChips .chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      state.rub = chip.dataset.rub;
      renderArchive(true);
    });

    vQ.addEventListener('input', ()=>{
      state.q = vQ.value || "";
      renderArchive(true);
    });

    loadMore.addEventListener('click', (e)=>{
      e.preventDefault();
      renderArchive(false);
    });

    async function loadJson(url){
      const r = await fetch(url, { cache: "no-store" });
      if(!r.ok) throw new Error(`Failed to load ${url}: ${r.status}`);
      return r.json();
    }

    async function init(){
      try{
        const [tv, vod] = await Promise.all([
          loadJson("/content/tv/videos.json"),
          loadJson("/content/home/videoOfDay.json")
        ]);

        updatedLabel.textContent = tv?.updatedAt
          ? ("Обновлено: " + tv.updatedAt.replace("T"," ").replace("Z",""))
          : "—";

        allVideos = Array.isArray(tv?.items) ? tv.items : [];
        renderArchive(true);

        const vodItem = vod?.item || allVideos[0] || null;
        if(vodItem){
          document.getElementById('vodTitle').textContent = vodItem.title || "Видео дня";
          document.getElementById('vodDesc').textContent = vodItem.description || "";
          document.getElementById('vodWhen').textContent = fmtDate(vodItem.date) || "—";

          const vodLen = fmtDur(vodItem.duration);
          document.getElementById('vodLen').textContent = vodLen || "—";

          document.getElementById('vodViews').textContent = fmtViews(vodItem.views) + " просмотров";

          const cover = document.getElementById("vodCover");
          if(vodItem.thumb){
            cover.style.backgroundImage = `url('${vodItem.thumb}')`;
            cover.style.display = "block";
          }

          const vodMaterial = document.getElementById("vodMaterial");
          vodMaterial.href = vodItem.href || "https://vk.com/promrep";
          vodMaterial.target = "_blank";
          vodMaterial.rel = "noopener";

          const openVod = ()=> openVideo(vodItem);
          document.getElementById('vodPlay').addEventListener('click', openVod);
          document.getElementById('vodOpen').addEventListener('click', openVod);

          document.getElementById('vodShare').addEventListener('click', ()=>{
            const url = vodItem.href || location.href;
            if (navigator.share) {
              navigator.share({ title: vodItem.title, text: vodItem.description, url }).catch(()=>{});
            } else {
              navigator.clipboard?.writeText(url)
                .then(()=> alert("Ссылка скопирована"))
                .catch(()=> prompt("Скопируй ссылку:", url));
            }
          });
        } else {
          document.getElementById('vodDesc').textContent =
            "Пока нет данных. Проверьте, что GitHub Actions обновил content/*.json";
        }
      }catch(err){
        console.error(err);
        document.getElementById('vodDesc').textContent =
          "Ошибка загрузки контента. Откройте консоль (F12) и посмотрите, какие JSON не загрузились.";
      }
    }

    init();
  </script>

  <script>
    (function(){
      const d = document.querySelector('.nav-mobile');
      if(!d) return;

      d.querySelectorAll('a').forEach(a=>{
        a.addEventListener('click', ()=> d.removeAttribute('open'));
      });

      document.addEventListener('click', (e)=>{
        if(d.hasAttribute('open') && !d.contains(e.target)){
          d.removeAttribute('open');
        }
      });

      document.addEventListener('keydown', (e)=>{
        if(e.key === 'Escape') d.removeAttribute('open');
      });
    })();
  </script>

  <script>
    (function () {
      const KEY = "theme";
      const root = document.documentElement;
      const toggles = Array.from(document.querySelectorAll("[data-theme-toggle]"));

      const ICON_MOON = `<path fill="currentColor" d="M21.4 13.1a8.9 8.9 0 0 1-10.5-10.5A9.6 9.6 0 1 0 21.4 13.1Z"/>`;
      const ICON_SUN = `<path fill="currentColor" d="M12 18.2a6.2 6.2 0 1 1 0-12.4a6.2 6.2 0 0 1 0 12.4Zm0-14.9a1 1 0 0 1 1 1v1.2a1 1 0 1 1-2 0V4.3a1 0 0 1 1-1Zm0 16.2a1 1 0 0 1 1 1v1.2a1 1 0 1 1-2 0v-1.2a1 0 0 1 1-1Z"/>`;

      function currentTheme() {
        return root.getAttribute("data-theme") === "dark" ? "dark" : "light";
      }
      function setIcon(btn, theme){
        const svg = btn.querySelector("svg");
        if(!svg) return;
        const isDark = theme === "dark";
        svg.innerHTML = isDark ? ICON_SUN : ICON_MOON;
      }
      function apply(theme) {
        if (theme === "dark") root.setAttribute("data-theme", "dark");
        else root.removeAttribute("data-theme");
        toggles.forEach(btn => setIcon(btn, theme));
      }

      toggles.forEach(btn => {
        btn.addEventListener("click", () => {
          const next = currentTheme() === "dark" ? "light" : "dark";
          localStorage.setItem(KEY, next);
          apply(next);
        });
      });

      apply(localStorage.getItem(KEY) || currentTheme());
    })();
  </script>
</body>
</html>
