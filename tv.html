<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>TV — Промышленный репортёр</title>

  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <meta name="theme-color" content="#ef2b1a">

  <script>
    (function () {
      const key = "theme";
      const saved = localStorage.getItem(key);

      const systemDark =
        window.matchMedia &&
        window.matchMedia("(prefers-color-scheme: dark)").matches;

      const theme = saved || (systemDark ? "dark" : "light");

      if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>

  <style>
    :root{
      --bg:#f4f5f6;
      --paper:#ffffff;
      --ink:#0b0b0c;
      --muted:#5a5a61;
      --muted2:#7a7a83;

      --line:rgba(11,11,12,.12);
      --line2:rgba(11,11,12,.08);
      --soft:rgba(11,11,12,.05);

      --red:#f02000;

      --max:1160px;
      --pad:22px;
      --r:16px;

      --shadow2:0 10px 18px rgba(11,11,12,.06);

      --headerBg:rgba(244,245,246,.92);
      --grid1:rgba(0,0,0,.028);
      --grid2:rgba(0,0,0,.024);
    }

    html[data-theme="dark"]{
      --bg:#0b0b0c;
      --paper:#101214;
      --ink:#f4f5f6;
      --muted:rgba(244,245,246,.70);
      --muted2:rgba(244,245,246,.58);

      --line:rgba(255,255,255,.12);
      --line2:rgba(255,255,255,.08);
      --soft:rgba(255,255,255,.06);

      --red:#ff2a2a;

      --shadow2:0 10px 18px rgba(0,0,0,.32);

      --headerBg:rgba(11,11,12,.72);
      --grid1:rgba(255,255,255,.06);
      --grid2:rgba(255,255,255,.05);
    }

    *{
      box-sizing:border-box;
    }

    html,
    body{
      transition:
        background-color .18s ease,
        color .18s ease;
    }

    body{
      margin:0;

      font-family:
        ui-sans-serif,
        system-ui,
        -apple-system,
        "Segoe UI",
        Roboto,
        Arial,
        "Noto Sans",
        "Helvetica Neue",
        sans-serif;

      background:var(--bg);
      color:var(--ink);
      letter-spacing:.15px;
      text-rendering:geometricPrecision;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    button,
    input{
      font-family:inherit;
    }

    .container{
      width:min(var(--max), calc(100% - var(--pad) * 2));
      margin:0 auto;
    }

    .grid{
      position:fixed;
      inset:0;
      z-index:0;
      pointer-events:none;

      background:
        linear-gradient(
          to right,
          var(--grid1) 1px,
          transparent 1px
        ) 0 0 / 84px 84px,

        linear-gradient(
          to bottom,
          var(--grid2) 1px,
          transparent 1px
        ) 0 0 / 84px 84px;

      mask-image:
        radial-gradient(
          ellipse at 50% 0%,
          black 32%,
          transparent 72%
        );

      opacity:.45;
    }

    /* =========================
       ШАПКА
       ========================= */

    header{
      position:sticky;
      top:0;
      z-index:10;

      background:var(--headerBg);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);

      border-bottom:1px solid var(--line);
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:14px 0;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:260px;
    }

    .logoPlate{
      width:52px;
      height:44px;

      display:inline-grid;
      place-items:center;
      flex:0 0 auto;

      border-radius:12px;
      background:transparent;

      transition:
        background-color .18s ease,
        box-shadow .18s ease;
    }

    .brand img{
      width:44px;
      height:44px;
      object-fit:contain;
      display:block;
      filter:none;
      transition:opacity .18s ease;
    }

    html[data-theme="dark"] .logoPlate{
      background:#f4f5f6;

      box-shadow:
        0 0 0 1px rgba(255,255,255,.10),
        0 8px 20px rgba(0,0,0,.30);
    }

    .brand:hover img{
      opacity:.85;
    }

    .brand .t{
      display:flex;
      flex-direction:column;
      line-height:1.05;
    }

    .brand .t strong{
      text-transform:uppercase;
      font-size:13px;
      letter-spacing:1.7px;
    }

    .nav-desktop{
      display:flex;
      align-items:center;
      gap:18px;
    }

    .navlink{
      font-size:13px;
      color:var(--muted);
      padding:8px 0;

      border-bottom:2px solid transparent;
      transition:.14s ease;
      white-space:nowrap;
    }

    .navlink:hover{
      color:var(--ink);
      border-bottom-color:rgba(240,32,0,.28);
    }

    .navlink.active{
      color:var(--ink);
      border-bottom-color:var(--red);
    }

    /*
     * Такая же ширина правого блока,
     * как на index и news.
     *
     * Поиска в шапке TV нет, но кнопка темы
     * остаётся на том же месте.
     */
    .actions{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:10px;
      min-width:240px;
    }

    .btn{
      border:1px solid var(--ink);
      background:transparent;
      color:var(--ink);

      border-radius:999px;
      padding:10px 12px;

      font-size:13px;
      cursor:pointer;
      transition:.14s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
    }

    .btn.primary{
      border-color:var(--red);
      color:var(--red);
      font-weight:800;
    }

    .themeBtn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;

      border-color:var(--line2);
      background:var(--paper);
      color:var(--ink);

      padding:10px 12px;
      white-space:nowrap;
    }

    .themeIcon{
      width:18px;
      height:18px;
      display:block;
    }

    .themeLabel{
      font-size:12px;
      font-weight:900;
      letter-spacing:.4px;
      color:var(--muted);
    }

    @media (min-width:721px){
      .themeBtn{
        padding:10px 11px;
      }

      .themeLabel{
        display:none;
      }
    }

    /* =========================
       МОБИЛЬНОЕ МЕНЮ
       ========================= */

    .nav-mobile{
      display:none;
      position:relative;
    }

    .burger{
      cursor:pointer;
      user-select:none;

      padding:8px 10px;

      border-radius:12px;
      border:1px solid var(--line2);

      background:var(--paper);
      color:var(--ink);

      font-weight:900;
      line-height:1;
    }

    .burger::-webkit-details-marker{
      display:none;
    }

    .burger::marker{
      content:"";
    }

    .nav-panel{
      display:none;
      position:absolute;
      top:calc(100% + 10px);
      right:0;
      z-index:50;

      min-width:min(320px, 92vw);
      padding:12px;

      background:var(--paper);
      border:1px solid var(--line);
      border-radius:16px;
      box-shadow:0 18px 40px rgba(0,0,0,.18);

      flex-direction:column;
      gap:10px;
    }

    .nav-mobile[open] .nav-panel{
      display:flex;
    }

    .nav-panel .navlink{
      color:var(--ink);
      padding:10px 8px;
      border-bottom:1px solid var(--line2);
    }

    .nav-panel .navlink:last-of-type{
      border-bottom:0;
    }

    .nav-panel .themeBtn{
      width:100%;
      justify-content:center;
      border-color:var(--line2);
      background:rgba(11,11,12,.02);
    }

    /* =========================
       ОСНОВНОЙ КОНТЕНТ
       ========================= */

    main{
      position:relative;
      z-index:1;
      padding:18px 0 56px;
    }

    .kicker{
      display:flex;
      align-items:center;
      gap:10px;

      font-size:12px;
      letter-spacing:1.4px;
      text-transform:uppercase;
      color:var(--muted);
    }

    .kicker .dot{
      width:9px;
      height:9px;
      border-radius:3px;
      background:var(--red);
    }

    .section{
      margin-top:18px;
    }

    .section-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:14px;
      margin-bottom:12px;
    }

    .section-head h2{
      margin:0;
      font-size:18px;
      letter-spacing:.2px;
    }

    .section-head p{
      margin:0;
      font-size:13px;
      color:var(--muted);
    }

    .more{
      font-size:13px;
      color:var(--red);
      font-weight:900;

      padding:8px 10px;

      border-radius:999px;
      border:1px solid rgba(240,32,0,.22);
      background:rgba(240,32,0,.05);

      transition:.14s ease;
      white-space:nowrap;
    }

    .more:hover{
      transform:translateY(-1px);
      background:rgba(240,32,0,.08);
    }

    /* =========================
       ВИДЕО ДНЯ
       ========================= */

    .vod{
      display:grid;
      grid-template-columns:1.2fr .8fr;
      gap:14px;
      align-items:stretch;
    }

    .player{
      position:relative;
      overflow:hidden;

      aspect-ratio:16/9;

      display:grid;
      place-items:center;

      border-radius:var(--r);
      border:1px solid var(--line);
      box-shadow:var(--shadow2);

      background:
        radial-gradient(
          560px 220px at 20% 15%,
          rgba(240,32,0,.14),
          transparent 60%
        ),
        linear-gradient(
          180deg,
          rgba(11,11,12,.05),
          rgba(11,11,12,.015)
        );
    }

    .player .cover{
      position:absolute;
      inset:0;

      background-size:cover;
      background-position:center;

      filter:contrast(1.02) saturate(.98);
      opacity:.95;
    }

    .player::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:1;
      pointer-events:none;

      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,.05),
          rgba(0,0,0,.28)
        );
    }

    .player .label{
      position:absolute;
      top:12px;
      left:12px;
      z-index:2;

      display:inline-flex;
      align-items:center;
      gap:8px;

      padding:6px 10px;

      border-radius:999px;
      border:1px solid rgba(240,32,0,.22);

      background:rgba(240,32,0,.06);
      color:var(--ink);

      font-size:12px;
      font-weight:900;
      letter-spacing:.6px;
      text-transform:uppercase;
    }

    .player .label i{
      width:7px;
      height:7px;
      display:inline-block;

      border-radius:2px;
      background:var(--red);
    }

    .play{
      position:relative;
      z-index:2;

      width:74px;
      height:74px;

      display:grid;
      place-items:center;

      border-radius:22px;
      border:1px solid rgba(240,32,0,.36);

      background:rgba(240,32,0,.12);
      color:var(--ink);

      cursor:pointer;
      backdrop-filter:blur(6px);
      transition:.14s ease;
    }

    .play:hover{
      transform:translateY(-2px) scale(1.04);
      background:rgba(240,32,0,.20);
    }

    .vinfo{
      min-width:0;
      padding:14px;

      display:flex;
      flex-direction:column;
      gap:10px;

      background:var(--paper);
      border:1px solid var(--line);
      border-radius:var(--r);
      box-shadow:var(--shadow2);
    }

    .vinfo b{
      font-size:16px;
      line-height:1.25;
    }

    .vinfo p{
      margin:0;
      color:var(--muted);
      font-size:13px;
      line-height:1.6;
    }

    .meta{
      margin-top:6px;

      display:flex;
      flex-wrap:wrap;
      gap:8px;

      font-size:12px;
      color:var(--muted);
    }

    .tag{
      padding:6px 10px;

      border-radius:999px;
      border:1px solid var(--soft);

      background:rgba(11,11,12,.02);
      white-space:nowrap;
    }

    .tag.hot{
      border-color:rgba(240,32,0,.22);
      background:rgba(240,32,0,.05);
      color:var(--ink);
      font-weight:800;
    }

    .vinfo .btn{
      border-color:var(--line);
      background:rgba(11,11,12,.03);
      color:var(--ink);
    }

    .vinfo .btn.primary{
      background:rgba(240,32,0,.10);
      border-color:rgba(240,32,0,.45);
      color:var(--red);
    }

    html[data-theme="dark"] .vinfo .btn{
      background:rgba(255,255,255,.06);
      border-color:rgba(255,255,255,.18);
      color:#fff;
    }

    html[data-theme="dark"] .vinfo .btn.primary{
      background:rgba(255,42,42,.18);
      border-color:rgba(255,42,42,.55);
      color:var(--red);
    }

    /* =========================
       КАТАЛОГ
       ========================= */

    .panel{
      overflow:hidden;

      background:var(--paper);
      border:1px solid var(--line);
      border-radius:var(--r);
      box-shadow:var(--shadow2);
    }

    .panel-head{
      padding:12px 14px;

      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:14px;

      border-bottom:1px solid var(--line2);

      background:
        linear-gradient(
          180deg,
          rgba(11,11,12,.018),
          transparent
        );
    }

    .panel-head .left b{
      display:block;

      font-size:12px;
      letter-spacing:1.2px;
      text-transform:uppercase;
      color:var(--muted);
    }

    .panel-head .left span{
      display:block;
      margin-top:6px;

      font-size:13px;
      color:var(--muted);
    }

    .count-label{
      font-size:12px;
      color:var(--muted);
    }

    .panel-body{
      padding:12px 14px 14px;
    }

    .filters-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:10px;

      margin-bottom:12px;
    }

    .searchline{
      flex:1 1 320px;
      min-width:240px;

      border:1px solid var(--line2);
      background:var(--paper);
      color:var(--ink);

      border-radius:999px;
      padding:10px 12px;

      font-size:13px;
      outline:none;
    }

    .searchline::placeholder{
      color:var(--muted2);
    }

    .searchline:focus{
      border-color:rgba(240,32,0,.40);
      box-shadow:0 0 0 3px rgba(240,32,0,.07);
    }

    .chips{
      display:flex;
      flex-wrap:wrap;
      justify-content:flex-end;
      gap:8px;
    }

    .chip{
      padding:8px 10px;

      border-radius:999px;
      border:1px solid var(--line2);

      background:var(--paper);
      color:var(--muted);

      font-size:12px;
      cursor:pointer;
      user-select:none;
      white-space:nowrap;
    }

    .chip.active{
      color:var(--ink);
      font-weight:900;

      border-color:rgba(240,32,0,.22);
      background:rgba(240,32,0,.05);
    }

    /* =========================
       КАРТОЧКИ ВИДЕО
       ========================= */

    .grid-videos{
      display:grid;
      grid-template-columns:repeat(12, 1fr);
      gap:14px;
    }

    .vcard{
      grid-column:span 4;
      min-height:240px;

      display:flex;
      flex-direction:column;
      overflow:hidden;

      background:var(--paper);
      border:1px solid var(--line);
      border-radius:var(--r);
      box-shadow:var(--shadow2);

      transition:
        transform .14s ease,
        border-color .14s ease;
    }

    .vcard:hover{
      transform:translateY(-2px);
      border-color:rgba(240,32,0,.24);
    }

    .thumb{
      position:relative;
      overflow:hidden;

      aspect-ratio:16/9;

      display:grid;
      place-items:center;

      border-bottom:1px solid var(--line2);

      background:
        radial-gradient(
          560px 220px at 20% 15%,
          rgba(240,32,0,.14),
          transparent 60%
        ),
        linear-gradient(
          180deg,
          rgba(11,11,12,.06),
          rgba(11,11,12,.02)
        );
    }

    .thumb .cover{
      position:absolute;
      inset:0;

      background-size:cover;
      background-position:center;
      opacity:.95;
    }

    .thumb::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:1;
      pointer-events:none;

      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,0),
          rgba(0,0,0,.28)
        );
    }

    .thumb .p{
      position:relative;
      z-index:2;

      width:54px;
      height:54px;

      display:grid;
      place-items:center;

      border-radius:18px;
      border:1px solid rgba(240,32,0,.36);

      background:rgba(240,32,0,.12);
      backdrop-filter:blur(6px);
    }

    .vbody{
      min-width:0;
      flex:1;
      padding:12px 14px 14px;

      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .vtop{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;

      font-size:12px;
      color:var(--muted);
    }

    .vrub{
      display:inline-flex;
      align-items:center;
      gap:8px;

      font-weight:900;
      color:var(--ink);
    }

    .vrub::before{
      content:"";

      width:8px;
      height:8px;

      display:inline-block;

      border-radius:2px;
      background:var(--red);
    }

    .vtitle{
      font-size:14.5px;
      font-weight:900;
      line-height:1.25;

      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .vdesc{
      margin:0;

      color:var(--muted);
      font-size:13px;
      line-height:1.6;

      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .vmeta{
      margin-top:auto;

      display:flex;
      flex-wrap:wrap;
      gap:8px;

      font-size:12px;
      color:var(--muted);
    }

    .empty-result{
      grid-column:1 / -1;

      padding:10px 2px;

      color:var(--muted);
      font-size:13px;
    }

    /* =========================
       FOOTER
       ========================= */

    footer{
      margin-top:34px;
      padding:18px 0;

      display:flex;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:14px;

      border-top:1px solid var(--line);

      color:var(--muted);
      font-size:12px;
    }

    /* =========================
       МОДАЛЬНОЕ ОКНО
       ========================= */

    .modal{
      position:fixed;
      inset:0;
      z-index:999;

      display:none;
      align-items:center;
      justify-content:center;

      padding:22px;
      background:rgba(0,0,0,.62);
    }

    .modal.open{
      display:flex;
    }

    .modal-card{
      width:min(980px, 100%);
      overflow:hidden;

      background:var(--paper);
      border:1px solid var(--line);
      border-radius:18px;

      box-shadow:0 22px 60px rgba(0,0,0,.35);
    }

    .modal-head{
      padding:10px 12px;

      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;

      border-bottom:1px solid var(--line2);
    }

    .modal-head b{
      font-size:13px;
    }

    .modal-close{
      padding:8px 10px;

      border:1px solid var(--line2);
      border-radius:999px;

      background:var(--paper);
      color:var(--ink);

      cursor:pointer;
    }

    .modal-player{
      position:relative;
      aspect-ratio:16/9;
      background:#000;
    }

    .modal-player iframe{
      position:absolute;
      inset:0;

      width:100%;
      height:100%;

      border:0;
    }

    /* =========================
       АДАПТИВ
       ========================= */

    @media (max-width:980px){
      .vod{
        grid-template-columns:1fr;
      }

      .vcard{
        grid-column:span 6;
      }

      .chips{
        justify-content:flex-start;
      }
    }

    @media (max-width:720px){
      :root{
        --pad:14px;
      }

      /*
       * Мобильная шапка.
       */
      .brand{
        min-width:auto;
      }

      .nav-desktop{
        display:none;
      }

      .nav-mobile{
        display:block;
      }

      .actions{
        min-width:auto;
      }

      .actions .themeBtn{
        display:none;
      }

      /*
       * Сразу после шапки показываются:
       * 1. поиск;
       * 2. карточки видео.
       */
      main{
        padding:12px 0 42px;
      }

      .page-kicker{
        display:none;
      }

      .vod-day{
        display:none;
      }

      .archive-section{
        margin-top:0;
      }

      .archive-section > .section-head{
        display:none;
      }

      /*
       * Убираем слова:
       * «Каталог», «Обновлено» и количество материалов.
       */
      .panel-head{
        display:none;
      }

      /*
       * Убираем внешнее оформление каталога,
       * чтобы поиск начинался сразу после шапки.
       */
      .panel{
        overflow:visible;

        border:0;
        border-radius:0;
        background:transparent;
        box-shadow:none;
      }

      .panel-body{
        padding:0;
      }

      .filters-top{
        display:block;
        margin:0 0 12px;
      }

      .searchline{
        width:100%;
        min-width:0;
        padding:12px 14px;
      }

      /*
       * Убираем фильтры «Все» и «TV».
       */
      .chips{
        display:none;
      }

      .grid-videos{
        gap:12px;
      }

      .vcard{
        grid-column:span 12;
      }

      /*
       * Убираем подпись TV внутри карточек.
       */
      .vrub{
        display:none;
      }

      .vtop{
        justify-content:flex-end;
      }

      footer{
        margin-top:24px;
      }
    }

    @media (prefers-reduced-motion:reduce){
      *{
        transition:none !important;
      }

      .vcard:hover,
      .play:hover,
      .more:hover,
      .btn:hover{
        transform:none !important;
      }
    }
  </style>
</head>

  <main class="container">

    <section

    <section

      <!--

  <div
    class="modal"
    id="modal"
    aria-hidden="true"
  >
    <div
      class="modal-card"
      role="dialog"
      aria-modal="true"
      aria-label="Просмотр видео"
    >
      <div class="modal-head">
        <b id="modalTitle">Видео</b>

        <button
          class="modal-close"
          id="modalClose"
          type="button"
        >
          Закрыть
        </button>

      <div
        class="modal-player"
        id="modalPlayer"
      ></div>
    </div>
  </div>

  <script>
    "use strict";

    document.getElementById("y").textContent =
      new Date().getFullYear();

    const state = {
      q:"",
      rub:"all"
    };

    let allVideos = [];
    let shown = 0;

    const pageSize = 12;

    const vQ =
      document.getElementById("vQ");

    const grid =
      document.getElementById("gridVideos");

    const loadMore =
      document.getElementById("loadMore");

    const mobileLoadMore =
      document.getElementById("mobileLoadMore");

    const mobileLoadMoreWrap =
      document.getElementById("mobileLoadMoreWrap");

    const countLabel =
      document.getElementById("countLabel");

    const updatedLabel =
      document.getElementById("updatedLabel");

    const modal =
      document.getElementById("modal");

    const modalTitle =
      document.getElementById("modalTitle");

    const modalPlayer =
      document.getElementById("modalPlayer");

    const modalClose =
      document.getElementById("modalClose");

    function escapeHtml(value){
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttribute(value){
      return escapeHtml(value);
    }

    function safeCssUrl(value){
      if(!value){
        return "";
      }

      return encodeURI(String(value))
        .replaceAll('"', "%22")
        .replaceAll("'", "%27");
    }

    function fmtViews(value){
      const number =
        Number(value || 0);

      if(number >= 1000000){
        return (
          (number / 1000000)
            .toFixed(1)
            .replace(".0", "") +
          "M"
        );
      }

      if(number >= 1000){
        return (
          Math.round(number / 1000) +
          "k"
        );
      }

      return String(number);
    }

    function fmtDate(timestamp){
      if(!timestamp){
        return "—";
      }

      const date =
        new Date(Number(timestamp) * 1000);

      if(Number.isNaN(date.getTime())){
        return "—";
      }

      return date.toLocaleDateString(
        "ru-RU",
        {
          day:"2-digit",
          month:"2-digit",
          year:"numeric"
        }
      );
    }

    function fmtDur(seconds){
      if(
        typeof seconds === "string" &&
        seconds.includes(":")
      ){
        return seconds;
      }

      const numeric =
        Number(seconds);

      if(
        !Number.isFinite(numeric) ||
        numeric < 0
      ){
        return "";
      }

      const total =
        Math.floor(numeric);

      const hours =
        Math.floor(total / 3600);

      const minutes =
        Math.floor((total % 3600) / 60);

      const remaining =
        total % 60;

      if(hours > 0){
        return (
          `${hours}:` +
          `${String(minutes).padStart(2, "0")}:` +
          `${String(remaining).padStart(2, "0")}`
        );
      }

      return (
        `${minutes}:` +
        `${String(remaining).padStart(2, "0")}`
      );
    }

    function openVideo(item){
      if(!item){
        return;
      }

      if(!item.embedUrl){
        window.open(
          item.href || "https://vk.com/promrep",
          "_blank",
          "noopener"
        );

        return;
      }

      modalTitle.textContent =
        item.title || "Видео";

      const separator =
        item.embedUrl.includes("?")
          ? "&"
          : "?";

      modalPlayer.innerHTML = `
        <iframe
          src="${escapeAttribute(item.embedUrl)}${separator}autoplay=1"
          allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
          allowfullscreen
        ></iframe>
      `;

      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
    }

    function closeModal(){
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      modalPlayer.innerHTML = "";
    }

    modalClose.addEventListener(
      "click",
      closeModal
    );

    modal.addEventListener(
      "click",
      event => {
        if(event.target === modal){
          closeModal();
        }
      }
    );

    document.addEventListener(
      "keydown",
      event => {
        if(event.key === "Escape"){
          closeModal();
        }
      }
    );

    function matches(video){
      const query =
        state.q.trim().toLowerCase();

      const matchesQuery =
        !query ||
        (video.title || "")
          .toLowerCase()
          .includes(query) ||
        (video.description || "")
          .toLowerCase()
          .includes(query);

      const matchesRubric =
        state.rub === "all" ||
        (video.rubric || "TV") === state.rub;

      return matchesQuery && matchesRubric;
    }

    function syncLoadMoreButtons(hasMore){
      const isMobile =
        window.matchMedia("(max-width: 720px)").matches;

      loadMore.style.display =
        !isMobile && hasMore
          ? ""
          : "none";

      mobileLoadMoreWrap.style.display =
        isMobile && hasMore
          ? "block"
          : "none";
    }

    function renderArchive(reset){
      if(reset){
        shown = 0;
        grid.innerHTML = "";
      }

      const filtered =
        allVideos.filter(matches);

      countLabel.textContent =
        `${filtered.length} материалов`;

      const slice =
        filtered.slice(
          shown,
          shown + pageSize
        );

      shown += slice.length;

      const cards = slice.map(video => {
        const duration =
          fmtDur(video.duration);

        const key =
          `${video.ownerId}_${video.id}`;

        const thumb = video.thumb
          ? `
            <div
              class="cover"
              style="
                background-image:
                  url('${safeCssUrl(video.thumb)}');
              "
            ></div>
          `
          : "";

        return `
          <a
            class="vcard"
            href="#"
            data-id="${escapeAttribute(key)}"
            aria-label="${escapeAttribute(video.title || "Открыть видео")}"
          >
            <div class="thumb">
              ${thumb}

              <div
                class="p"
                aria-hidden="true"
              >
                <svg
                  width="22"
                  height="22"
                  viewBox="0 0 24 24"
                  fill="none"
                >
                  <path
                    d="M9 7v10l9-5-9-5Z"
                    fill="currentColor"
                  />
                </svg>
              </div>
            </div>

            <div class="vbody">
              <div class="vtop">
                <span class="vrub">
                  TV
                </span>

                <span>
                  ${escapeHtml(fmtViews(video.views))}
                  просмотров
                </span>
              </div>

              <div class="vtitle">
                ${escapeHtml(video.title || "Без названия")}
              </div>

              <p class="vdesc">
                ${escapeHtml(video.description || "")}
              </p>

              <div class="vmeta">
                <span class="tag">
                  ${escapeHtml(fmtDate(video.date))}
                </span>

                ${
                  duration
                    ? `
                      <span class="tag hot">
                        ${escapeHtml(duration)}
                      </span>
                    `
                    : ""
                }
              </div>
            </div>
          </a>
        `;
      });

      grid.insertAdjacentHTML(
        "beforeend",
        cards.join("")
      );

      const hasMore =
        shown < filtered.length;

      syncLoadMoreButtons(hasMore);

      if(filtered.length === 0){
        grid.innerHTML = `
          <div class="empty-result">
            Ничего не найдено. Попробуйте другой запрос.
          </div>
        `;

        syncLoadMoreButtons(false);
      }
    }

    grid.addEventListener(
      "click",
      event => {
        const card =
          event.target.closest("a.vcard");

        if(!card){
          return;
        }

        event.preventDefault();

        const key =
          card.dataset.id;

        const item =
          allVideos.find(
            video =>
              `${video.ownerId}_${video.id}` === key
          );

        if(item){
          openVideo(item);
        }
      }
    );

    document
      .getElementById("rubChips")
      .addEventListener(
        "click",
        event => {
          const chip =
            event.target.closest(".chip");

          if(!chip){
            return;
          }

          document
            .querySelectorAll("#rubChips .chip")
            .forEach(item => {
              item.classList.remove("active");
            });

          chip.classList.add("active");

          state.rub =
            chip.dataset.rub;

          renderArchive(true);
        }
      );

    vQ.addEventListener(
      "input",
      () => {
        state.q =
          vQ.value || "";

        renderArchive(true);
      }
    );

    function handleLoadMore(event){
      event.preventDefault();
      renderArchive(false);
    }

    loadMore.addEventListener(
      "click",
      handleLoadMore
    );

    mobileLoadMore.addEventListener(
      "click",
      handleLoadMore
    );

    window.addEventListener(
      "resize",
      () => {
        const filtered =
          allVideos.filter(matches);

        syncLoadMoreButtons(
          shown < filtered.length
        );
      }
    );

    function cacheBust(url){
      const requestUrl = new URL(
        url,
        window.location.href
      );

      requestUrl.searchParams.set(
        "_",
        String(Date.now())
      );

      return requestUrl.href;
    }

    async function loadJson(url){
      const response = await fetch(
        cacheBust(url),
        {
          cache:"no-store",
          headers:{
            "Accept":"application/json",
            "Cache-Control":"no-cache, no-store, max-age=0",
            "Pragma":"no-cache"
          }
        }
      );

      if(!response.ok){
        throw new Error(
          `Failed to load ${url}: ${response.status}`
        );
      }

      return response.json();
    }

    async function init(){
      try{
        const [tv, vod] =
          await Promise.all([
            loadJson("/content/tv/videos.json"),
            loadJson("/content/home/videoOfDay.json")
          ]);

        updatedLabel.textContent =
          tv?.updatedAt
            ? (
                "Обновлено: " +
                tv.updatedAt
                  .replace("T", " ")
                  .replace("Z", "")
              )
            : "—";

        allVideos =
          Array.isArray(tv?.items)
            ? tv.items
            : [];

        renderArchive(true);

        const vodItem =
          vod?.item ||
          allVideos[0] ||
          null;

        if(!vodItem){
          document.getElementById("vodDesc").textContent =
            "Пока нет данных.";

          return;
        }

        document.getElementById("vodTitle").textContent =
          vodItem.title || "Видео дня";

        document.getElementById("vodDesc").textContent =
          vodItem.description || "";

        document.getElementById("vodWhen").textContent =
          fmtDate(vodItem.date);

        const vodLength =
          fmtDur(vodItem.duration);

        document.getElementById("vodLen").textContent =
          vodLength || "—";

        document.getElementById("vodViews").textContent =
          `${fmtViews(vodItem.views)} просмотров`;

        const cover =
          document.getElementById("vodCover");

        if(vodItem.thumb){
          cover.style.backgroundImage =
            `url('${safeCssUrl(vodItem.thumb)}')`;

          cover.style.display = "block";
        }

        const vodMaterial =
          document.getElementById("vodMaterial");

        vodMaterial.href =
          vodItem.href ||
          "https://vk.com/promrep";

        vodMaterial.target = "_blank";
        vodMaterial.rel = "noopener";

        const openVod = () => {
          openVideo(vodItem);
        };

        document
          .getElementById("vodPlay")
          .addEventListener(
            "click",
            openVod
          );

        document
          .getElementById("vodOpen")
          .addEventListener(
            "click",
            openVod
          );

        document
          .getElementById("vodShare")
          .addEventListener(
            "click",
            () => {
              const url =
                vodItem.href ||
                location.href;

              if(navigator.share){
                navigator
                  .share({
                    title:vodItem.title,
                    text:vodItem.description,
                    url
                  })
                  .catch(() => {});

                return;
              }

              navigator.clipboard
                ?.writeText(url)
                .then(() => {
                  alert("Ссылка скопирована");
                })
                .catch(() => {
                  prompt(
                    "Скопируйте ссылку:",
                    url
                  );
                });
            }
          );
      }catch(error){
        console.error(error);

        document.getElementById("vodDesc").textContent =
          "Ошибка загрузки контента.";

        grid.innerHTML = `
          <div class="empty-result">
            Не удалось загрузить видео.
          </div>
        `;

        syncLoadMoreButtons(false);
      }
    }

    init();
  </script>

  <script>
    (function () {
      const navigation =
        document.querySelector(".nav-mobile");

      if(!navigation){
        return;
      }

      navigation
        .querySelectorAll("a")
        .forEach(link => {
          link.addEventListener(
            "click",
            () => {
              navigation.removeAttribute("open");
            }
          );
        });

      document.addEventListener(
        "click",
        event => {
          if(
            navigation.hasAttribute("open") &&
            !navigation.contains(event.target)
          ){
            navigation.removeAttribute("open");
          }
        }
      );

      document.addEventListener(
        "keydown",
        event => {
          if(event.key === "Escape"){
            navigation.removeAttribute("open");
          }
        }
      );
    })();
  </script>

  <script>
    (function () {
      const KEY = "theme";
      const root = document.documentElement;

      const toggles = Array.from(
        document.querySelectorAll(
          "[data-theme-toggle]"
        )
      );

      const ICON_MOON = `
        <path
          fill="currentColor"
          d="M21.4 13.1a8.9 8.9 0 0 1-10.5-10.5A9.6 9.6 0 1 0 21.4 13.1Z"
        />
      `;

      const ICON_SUN = `
        <path
          fill="currentColor"
          d="M12 18.2a6.2 6.2 0 1 1 0-12.4a6.2 6.2 0 0 1 0 12.4Zm0-14.9a1 1 0 0 1 1 1v1.2a1 1 0 1 1-2 0V4.3a1 1 0 0 1 1-1Zm0 16.2a1 1 0 0 1 1 1v1.2a1 1 0 1 1-2 0v-1.2a1 1 0 0 1 1-1Z"
        />
      `;

      function currentTheme(){
        return (
          root.getAttribute("data-theme") === "dark"
            ? "dark"
            : "light"
        );
      }

      function apply(theme){
        if(theme === "dark"){
          root.setAttribute(
            "data-theme",
            "dark"
          );
        }else{
          root.removeAttribute(
            "data-theme"
          );
        }

        toggles.forEach(button => {
          const isDark =
            theme === "dark";

          button.setAttribute(
            "aria-pressed",
            isDark
              ? "true"
              : "false"
          );

          button.setAttribute(
            "aria-label",
            isDark
              ? "Включить светлую тему"
              : "Включить тёмную тему"
          );

          const svg =
            button.querySelector("svg");

          if(svg){
            svg.innerHTML =
              isDark
                ? ICON_SUN
                : ICON_MOON;
          }

          const label =
            button.querySelector(".themeLabel");

          if(label){
            label.textContent =
              isDark
                ? "Свет"
                : "Тема";
          }
        });
      }

      toggles.forEach(button => {
        button.addEventListener(
          "click",
          () => {
            const next =
              currentTheme() === "dark"
                ? "light"
                : "dark";

            localStorage.setItem(
              KEY,
              next
            );

            apply(next);
          }
        );
      });

      apply(
        localStorage.getItem(KEY) ||
        currentTheme()
      );
    })();
  </script>
</body>
</html>
