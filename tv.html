<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TV — Промышленный репортёр</title>

  <!-- Применяем тему ДО отрисовки (без мигания) -->
  <script>
    (function () {
      const key = "theme"; // "light" | "dark"
      const saved = localStorage.getItem(key);
      const systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      const theme = saved || (systemDark ? "dark" : "light");
      if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
    })();
  </script>

  <style>
    :root{
      --bg:#f4f5f6;
      --paper:#ffffff;
      --ink:#0b0b0c;
      --muted:#5a5a61;
      --muted2:#7a7a83;

      --line:rgba(11,11,12,.12);
      --line2:rgba(11,11,12,.08);
      --soft:rgba(11,11,12,.05);

      --red:#f02000;

      --panel:#0b0b0c;
      --panelText:#f7f7f8;
      --panelMuted:rgba(247,247,248,.72);

      --max:1160px;
      --pad:22px;

      --r:16px;
      --r2:12px;

      --shadow: 0 14px 26px rgba(11,11,12,.08);
      --shadow2: 0 10px 18px rgba(11,11,12,.06);

      --headerBg: rgba(244,245,246,.92);
      --grid1: rgba(0,0,0,.028);
      --grid2: rgba(0,0,0,.024);
    }

    html[data-theme="dark"]{
      --bg:#0b0b0c;
      --paper:#101214;
      --ink:#f4f5f6;
      --muted:rgba(244,245,246,.70);
      --muted2:rgba(244,245,246,.58);

      --line:rgba(255,255,255,.12);
      --line2:rgba(255,255,255,.08);
      --soft:rgba(255,255,255,.06);

      --red:#ff2a2a;

      --panel:#0b0b0c;
      --panelText:#f7f7f8;
      --panelMuted:rgba(247,247,248,.72);

      --shadow: 0 14px 26px rgba(0,0,0,.40);
      --shadow2: 0 10px 18px rgba(0,0,0,.32);

      --headerBg: rgba(11,11,12,.72);
      --grid1: rgba(255,255,255,.06);
      --grid2: rgba(255,255,255,.05);
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, "Noto Sans", "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--ink);
      letter-spacing:.15px;
      text-rendering: geometricPrecision;
    }
    a{ color:inherit; text-decoration:none; }
    .container{ width:min(var(--max), calc(100% - var(--pad)*2)); margin:0 auto; }

    html, body { transition: background-color .18s ease, color .18s ease; }
    *{ transition: background-color .18s ease, color .18s ease, border-color .18s ease; }

    .grid{
      position:fixed; inset:0; pointer-events:none; z-index:0;
      background:
        linear-gradient(to right, var(--grid1) 1px, transparent 1px) 0 0/ 84px 84px,
        linear-gradient(to bottom, var(--grid2) 1px, transparent 1px) 0 0/ 84px 84px;
      mask-image: radial-gradient(ellipse at 50% 0%, black 32%, transparent 72%);
      opacity:.45;
    }

    /* Header */
    header{
      position:sticky; top:0; z-index:10;
      background: var(--headerBg);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .topbar{
      display:flex; align-items:center; justify-content:space-between; gap:16px;
      padding: 14px 0;
    }
    .brand{ display:flex; align-items:center; gap:12px; min-width: 260px; }
    .brand img{ width:44px; height:44px; object-fit:contain; display:block; }
    .brand .t{ display:flex; flex-direction:column; line-height:1.05; }
    .brand .t strong{ text-transform:uppercase; font-size:13px; letter-spacing:1.7px; }
    .brand .t span{ font-size:12px; color: var(--muted); }

    /* links */
    .navlink{
      font-size:13px;
      color: var(--muted);
      padding: 8px 0;
      border-bottom: 2px solid transparent;
      transition:.14s ease;
      white-space:nowrap;
    }
    .navlink:hover{ color: var(--ink); border-bottom-color: rgba(240,32,0,.28); }
    .navlink.active{ color: var(--ink); border-bottom-color: var(--red); }

    .actions{ display:flex; align-items:center; gap:10px; min-width: 240px; justify-content:flex-end; }
    .search{
      width:min(260px, 34vw);
      border:1px solid var(--line2);
      background: var(--paper);
      border-radius: 999px;
      padding: 10px 12px;
      font-size: 13px;
      outline:none;
      transition:.14s ease;
    }
    .search:focus{ border-color: rgba(240,32,0,.40); box-shadow: 0 0 0 4px rgba(240,32,0,.08); }

    .btn{
      border:1px solid var(--ink);
      background: transparent;
      border-radius: 999px;
      padding: 10px 12px;
      font-size: 13px;
      cursor:pointer;
      transition:.14s ease;
      color: var(--ink);
    }
    .btn:hover{ transform: translateY(-1px); }
    .btn.primary{ border-color: var(--red); color: var(--red); font-weight:800; }

    /* кнопка темы */
    .themeBtn{
      border-color: var(--line2);
      background: var(--paper);
      color: var(--ink);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding: 10px 12px;
      white-space:nowrap;
    }
    .themeBtn:hover{ transform: translateY(-1px); }
    .themeIcon{ width:18px; height:18px; display:block; }
    .themeLabel{
      font-weight:900;
      letter-spacing:.4px;
      font-size: 12px;
      color: var(--muted);
    }
    @media (min-width: 721px){
      .themeLabel{ display:none; }
      .themeBtn{ padding: 10px 11px; }
    }

    main{ position:relative; z-index:1; padding: 18px 0 56px; }

    .kicker{
      display:flex; align-items:center; gap:10px;
      font-size:12px; letter-spacing:1.4px; text-transform:uppercase;
      color: var(--muted);
    }
    .kicker .dot{
      width:9px; height:9px; border-radius: 3px;
      background: var(--red);
    }

    /* ===== БУРГЕР-МЕНЮ ===== */
    .nav-desktop{
      display:flex;
      align-items:center;
      gap:18px;
    }
    .nav-mobile{
      display:none;
      position:relative;
    }
    .burger{
      cursor:pointer;
      user-select:none;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid var(--line2);
      background: var(--paper);
      color: var(--ink);
      font-weight: 900;
      line-height: 1;
    }
    .burger::-webkit-details-marker{ display:none; }
    .burger::marker{ content:""; }

    .nav-panel{
      display:none;
      position:absolute;
      top: calc(100% + 10px);
      right: 0;
      min-width: min(320px, 92vw);

      padding: 12px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 18px 40px rgba(0,0,0,.18);
      z-index: 50;

      flex-direction:column;
      gap:10px;
    }
    .nav-mobile[open] .nav-panel{ display:flex; }

    .nav-panel .navlink{
      color: var(--ink);
      padding: 10px 8px;
      border-bottom: 1px solid rgba(11,11,12,.06);
    }
    .nav-panel .navlink:last-child{ border-bottom: 0; }

    .nav-panel .themeBtn{
      width:100%;
      justify-content:center;
      border-color: var(--line2);
      background: rgba(11,11,12,.02);
    }

    /* Section head */
    .section{ margin-top: 18px; }
    .section-head{
      display:flex; justify-content:space-between; align-items:flex-end; gap:14px;
      margin-bottom: 12px;
    }
    .section-head h2{ margin:0; font-size: 18px; letter-spacing:.2px; }
    .section-head p{ margin:0; font-size: 13px; color: var(--muted); }
    .more{
      font-size: 13px;
      color: var(--red);
      font-weight: 900;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(240,32,0,.22);
      background: rgba(240,32,0,.05);
      transition:.14s ease;
      white-space:nowrap;
    }
    .more:hover{ transform: translateY(-1px); background: rgba(240,32,0,.08); }

    /* ===== Video of the day ===== */
    .vod{
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 14px;
      align-items:stretch;
    }
    .player{
      border-radius: var(--r);
      border: 1px solid var(--line);
      background:
        radial-gradient(560px 220px at 20% 15%, rgba(240,32,0,.14), transparent 60%),
        linear-gradient(180deg, rgba(11,11,12,.05), rgba(11,11,12,.015));
      aspect-ratio: 16/9;
      display:grid; place-items:center;
      box-shadow: var(--shadow2);
      position:relative;
      overflow:hidden;
    }
    .player .bg{
      position:absolute; inset:0;
      background-size: cover;
      background-position: center;
      filter: saturate(.98) contrast(1.02);
      opacity:.95;
    }
    .player .bg:before{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.35));
    }
    .player .label{
      position:absolute; top:12px; left:12px;
      display:inline-flex; align-items:center; gap:8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(240,32,0,.22);
      background: rgba(240,32,0,.06);
      color: var(--ink);
      font-size: 12px;
      font-weight: 900;
      letter-spacing:.6px;
      text-transform:uppercase;
      z-index:2;
      backdrop-filter: blur(6px);
    }
    .player .label i{ width:7px; height:7px; border-radius:2px; background: var(--red); display:inline-block; }

    .play{
      width:74px; height:74px;
      border-radius: 22px;
      border: 1px solid rgba(240,32,0,.36);
      background: rgba(240,32,0,.12);
      cursor:pointer;
      transition:.14s ease;
      display:grid; place-items:center;
      z-index:2;
      color: var(--ink);
      backdrop-filter: blur(8px);
    }
    .play:hover{ transform: translateY(-2px) scale(1.02); }

    .vinfo{
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow2);
      padding: 14px;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-width:0;
    }
    .vinfo b{ font-size: 16px; line-height:1.25; }
    .vinfo p{ margin:0; color: var(--muted); font-size:13px; line-height:1.6; }
    .meta{
      margin-top: 6px;
      display:flex; flex-wrap:wrap; gap:8px;
      font-size: 12px;
      color: var(--muted);
    }
    .tag{
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--soft);
      background: rgba(11,11,12,.02);
      white-space:nowrap;
    }
    .tag.hot{
      border-color: rgba(240,32,0,.22);
      background: rgba(240,32,0,.05);
      color: var(--ink);
      font-weight:800;
    }

    .vinfo .btn{
      border-color: var(--line);
      background: rgba(11,11,12,.03);
      color: var(--ink);
    }
    .vinfo .btn.primary{
      background: rgba(240,32,0,.10);
      border-color: rgba(240,32,0,.45);
      color: var(--red);
    }
    html[data-theme="dark"] .vinfo .btn{
      background: rgba(255,255,255,.06);
      border-color: rgba(255,255,255,.18);
      color: #ffffff;
    }
    html[data-theme="dark"] .vinfo .btn.primary{
      background: rgba(255,42,42,.18);
      border-color: rgba(255,42,42,.55);
      color: var(--red);
    }

    /* ===== Shorts ===== */
    .shorts-wrap{
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow2);
      overflow:hidden;
    }
    .shorts-head{
      padding: 12px 14px;
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:14px;
      border-bottom: 1px solid var(--line2);
      background: linear-gradient(180deg, rgba(11,11,12,.018), transparent);
    }
    .shorts-head b{
      font-size: 12px;
      letter-spacing:1.2px;
      text-transform:uppercase;
      color: var(--muted);
    }
    .shorts-row{
      padding: 14px;
      display:flex;
      gap: 12px;
      overflow:auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .shorts-row::-webkit-scrollbar{ height: 10px; }
    .shorts-row::-webkit-scrollbar-thumb{
      background: rgba(11,11,12,.14);
      border-radius: 999px;
      border: 3px solid rgba(0,0,0,0);
      background-clip: padding-box;
    }
    .short{
      scroll-snap-align: start;
      flex: 0 0 auto;
      width: 200px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .short-card{
      position:relative;
      border-radius: var(--r);
      overflow:hidden;
      border: 1px solid var(--line);
      box-shadow: var(--shadow2);
      aspect-ratio: 9/16;
      background:
        radial-gradient(520px 220px at 20% 18%, rgba(240,32,0,.16), transparent 60%),
        linear-gradient(180deg, rgba(11,11,12,.08), rgba(11,11,12,.02));
      display:grid;
      place-items:center;
      transition:.14s ease;
    }
    .short-card:hover{
      transform: translateY(-2px);
      border-color: rgba(240,32,0,.22);
    }
    .short-card img{
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit:cover;
      filter: contrast(1.02) saturate(.98);
      transform: scale(1.01);
    }
    .short-card:before{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,.00), rgba(0,0,0,.32));
      pointer-events:none;
    }
    .short-badge{
      position:absolute;
      top:10px; left:10px;
      display:inline-flex; align-items:center; gap:8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.22);
      color: rgba(247,247,248,.92);
      font-size: 11px;
      letter-spacing:.8px;
      text-transform:uppercase;
      z-index:1;
    }
    .short-badge i{
      width:7px; height:7px; border-radius:2px;
      background: var(--red);
      display:inline-block;
    }
    .short-play{
      position:relative;
      width:58px; height:58px;
      border-radius: 18px;
      border: 1px solid rgba(240,32,0,.36);
      background: rgba(240,32,0,.12);
      display:grid; place-items:center;
      cursor:pointer;
      transition:.14s ease;
      color: var(--ink);
      z-index:1;
      backdrop-filter: blur(6px);
    }
    .short-name{
      font-size: 13px;
      line-height: 1.35;
      color: var(--ink);
      font-weight: 800;
      display:-webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:hidden;
    }
    .short-meta{
      display:flex;
      justify-content:space-between;
      gap:10px;
      font-size: 12px;
      color: var(--muted);
    }

    /* ===== Archive ===== */
    .panel{
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow2);
      overflow:hidden;
    }
    .panel-head{
      padding: 12px 14px;
      border-bottom: 1px solid var(--line2);
      background: linear-gradient(180deg, rgba(11,11,12,.018), transparent);
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:14px;
    }
    .panel-head .left b{
      display:block;
      font-size: 12px;
      letter-spacing:1.2px;
      text-transform:uppercase;
      color: var(--muted);
    }
    .panel-head .left span{
      display:block;
      margin-top:6px;
      font-size: 13px;
      color: var(--muted);
    }

    .panel-body{ padding: 12px 14px 14px; }

    .filters-top{
      display:flex;
      gap: 10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:space-between;
      margin-bottom: 12px;
    }
    .searchline{
      flex: 1 1 320px;
      min-width: 240px;
      border:1px solid var(--line2);
      background: var(--paper);
      border-radius: 999px;
      padding: 10px 12px;
      font-size: 13px;
      outline:none;
      transition:.14s ease;
    }
    .searchline:focus{ border-color: rgba(240,32,0,.40); box-shadow: 0 0 0 4px rgba(240,32,0,.08); }

    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      justify-content:flex-end;
    }
    .chip{
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid var(--line2);
      background: var(--paper);
      color: var(--muted);
      cursor:pointer;
      transition:.14s ease;
      user-select:none;
      white-space:nowrap;
    }
    .chip:hover{ transform: translateY(-1px); }
    .chip.active{
      color: var(--ink);
      font-weight:900;
      border-color: rgba(240,32,0,.22);
      background: rgba(240,32,0,.05);
    }

    .grid-videos{
      display:grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 14px;
    }
    .vcard{
      grid-column: span 4;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r);
      overflow:hidden;
      box-shadow: var(--shadow2);
      transition:.14s ease;
      display:flex;
      flex-direction:column;
      min-height: 240px;
    }
    .vcard:hover{ transform: translateY(-2px); border-color: rgba(240,32,0,.22); }
    .thumb{
      aspect-ratio: 16/9;
      background:
        radial-gradient(560px 220px at 20% 15%, rgba(240,32,0,.14), transparent 60%),
        linear-gradient(180deg, rgba(11,11,12,.06), rgba(11,11,12,.02));
      border-bottom: 1px solid var(--line2);
      position:relative;
      display:grid; place-items:center;
      overflow:hidden;
    }
    .thumb img{
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit:cover;
      filter: contrast(1.02) saturate(.98);
    }
    .thumb:before{
      content:"";
      position:absolute; inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,.00), rgba(0,0,0,.28));
      pointer-events:none;
    }
    .thumb .p{
      position:relative;
      width:54px; height:54px;
      border-radius: 18px;
      border: 1px solid rgba(240,32,0,.36);
      background: rgba(240,32,0,.12);
      display:grid; place-items:center;
      z-index:1;
      backdrop-filter: blur(6px);
    }
    .vbody{
      padding: 12px 14px 14px;
      display:flex;
      flex-direction:column;
      gap:8px;
      min-width:0;
      flex:1;
    }
    .vtop{
      display:flex; justify-content:space-between; gap:10px;
      font-size:12px; color: var(--muted);
    }
    .vrub{
      display:inline-flex; align-items:center; gap:8px;
      font-weight:900; color: var(--ink);
    }
    .vrub:before{
      content:""; width:8px; height:8px; border-radius:2px; background: var(--red);
      display:inline-block;
    }
    .vtitle{
      font-size: 14.5px;
      font-weight: 900;
      line-height: 1.25;
      display:-webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:hidden;
    }
    .vdesc{
      margin:0;
      color: var(--muted);
      font-size: 13px;
      line-height:1.6;
      display:-webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow:hidden;
    }
    .vmeta{
      margin-top:auto;
      display:flex; gap:8px; flex-wrap:wrap;
      font-size: 12px; color: var(--muted);
    }

    footer{
      margin-top: 34px;
      border-top: 1px solid var(--line);
      padding: 18px 0;
      color: var(--muted);
      font-size: 12px;
      display:flex;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
    }

    /* Responsive */
    @media (max-width: 980px){
      .actions .search{ display:none; }
      .vod{ grid-template-columns: 1fr; }
      .vcard{ grid-column: span 6; }
      .short{ width: 176px; }
      .filters-top{ align-items:stretch; }
      .chips{ justify-content:flex-start; }
    }
    @media (max-width: 720px){
      .brand{ min-width:auto; }
      .actions{ min-width:auto; }
      .vcard{ grid-column: span 12; }
      .short{ width: 168px; }

      .nav-desktop{ display:none; }
      .nav-mobile{ display:block; }

      .actions .themeBtn{ display:none; }

      .vod .vinfo{ display:none; }
      .vod{ gap: 0; }
    }
    @media (prefers-reduced-motion: reduce){
      *{ transition:none !important; }
      .btn:hover,.more:hover,.play:hover,.short-card:hover,.vcard:hover,.chip:hover{ transform:none !important; }
    }
  </style>
</head>

<body>
  <div class="grid" aria-hidden="true"></div>

  <header>
    <div class="container">
      <div class="topbar">
        <a class="brand" href="index.html">
          <!-- ✅ FIX: нормальный img -->
          <img src="log.png" alt="Промышленный репортёр" />
          <div class="t">
            <strong>Промышленный репортёр</strong>
            <span>индустрия · экономика · технологии</span>
          </div>
        </a>

        <nav class="nav-desktop" aria-label="Меню">
          <a class="navlink" href="index.html">Главная</a>
          <a class="navlink" href="news.html">Новости</a>
