name: Update content from VK

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"  # каждые 30 минут

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update JSON from VK
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
          VK_OWNER_ID: "-234602001"
          VK_API_VERSION: "5.199"
          TV_COUNT: "50"
          SHORTS_COUNT: "30"
        run: node scripts/update-content.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/*.json content/*/*.json
          git diff --cached --quiet || (git commit -m "Update content from VK" && git push)
